<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seyir Cafe Menü</title>
    <style>
        :root {
            --primary-red: #e74c3c;
            --dark-bg: #1a1a1a;
            --card-bg: #fff;
            --text-color: #333;
        }

        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: var(--text-color);
        }

        /* Header ve Logo Stilleri */
        header {
            background-color: var(--dark-bg);
            color: white;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-bottom: 4px solid var(--primary-red);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            color: var(--primary-red);
            font-size: 28px;
            font-weight: bold;
        }

        .cafe-title {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #fff;
        }

        /* İ harfinin noktasını kalp yapma */
        .heart-i {
            position: relative;
            display: inline-block;
        }
        .heart-i::after {
            content: '♥';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--primary-red);
            font-size: 14px;
        }

        .cafe-subtitle {
            font-size: 14px;
            color: #bbb;
            margin-top: 5px;
            outline: none;
            border-bottom: 1px dashed transparent;
            cursor: pointer;
        }
        .cafe-subtitle:focus {
            border-bottom: 1px dashed var(--primary-red);
        }

        /* Kategoriler (Telefonda Sağa Kaydırma & "Tümü" Yok) */
        .categories-wrapper {
            background: #fff;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 5px;
            scrollbar-width: none; /* Firefox */
        }
        .categories::-webkit-scrollbar {
            display: none; /* Chrome, Safari */
        }

        .category-btn {
            background: #eee;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            color: #555;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .category-btn.active {
            background: var(--primary-red);
            color: white;
        }

        /* Ürün Listesi Grid Yapısı */
        .menu-container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
        }

        .product-image {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background-color: #ddd;
        }

        .product-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .product-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #222;
        }

        .product-price {
            background: var(--primary-red);
            color: white;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            position: absolute;
            top: 10px;
            right: 10px;
        }

        /* Yönetici Paneli / Düzenleme Butonu */
        .admin-bar {
            text-align: right;
            padding: 10px 20px;
        }
        .admin-toggle {
            background: #333;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <span class="logo-icon">☕</span>
            <!-- SEYİR CAFE - İ harfinin noktası kalp -->
            <div class="cafe-title">SEYİR CAF<span class="heart-i">I</span></div>
        </div>
        <!-- Altındaki yazı düzenlenebilir (contenteditable) ve localStorage ile kalıcı -->
        <div id="cafeSubtitle" class="cafe-subtitle" contenteditable="true" placeholder="Alt yazıyı düzenlemek için tıklayın...">Lezzetin ve Keyfin Buluşma Noktası</div>
    </header>

    <div class="admin-bar">
        <button class="admin-toggle" onclick="toggleAdminMode()">Yönetici Modu</button>
    </div>

    <!-- Kategoriler (Tümü kaldırıldı, sağa kaydırma aktif) -->
    <div class="categories-wrapper">
        <div class="categories" id="categoryContainer">
            <!-- Dinamik Kategoriler -->
        </div>
    </div>

    <!-- Ürünler -->
    <div class="menu-container">
        <div class="product-grid" id="productGrid">
            <!-- Dinamik Ürünler -->
        </div>
    </div>

    <script>
        // Ürün ve Kategori Verileri (Eski hatalı görseller temizlendi, doğru ürün görselleri atandı)
        const defaultMenuData = {
            "Sıcak İçecekler": [
                { name: "Türk Kahvesi", price: "90 TL", image: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=300" },
                { name: "Sıcak Çikolata", price: "100 TL", image: "https://images.unsplash.com/photo-1542990253-0d0f5be5f0ed?w=300" },
                { name: "Salep", price: "100 TL", image: "https://images.unsplash.com/photo-1572442388796-11668a67e53d?w=300" },
                { name: "Filtre Kahve", price: "110 TL", image: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=300" }
            ],
            "Soğuk İçecekler": [
                { name: "Buzlu Kahve (Iced Latte)", price: "120 TL", image: "https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=300" },
                { name: "Meşrubat (Kutu Kola)", price: "70 TL", image: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=300" },
                { name: "El Yapımı Limonata", price: "90 TL", image: "https://images.unsplash.com/photo-1621263764928-df1444c5e859?w=300" }
            ],
            "Tatlılar": [
                { name: "San Sebastian", price: "150 TL", image: "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=300" },
                { name: "Waffle", price: "160 TL", image: "https://images.unsplash.com/photo-1568051243851-f9b136146e97?w=300" }
            ],
            "Atıştırmalıklar": [
                { name: "Patates Kızartması", price: "90 TL", image: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=300" },
                { name: "Karışık Çerez", price: "110 TL", image: "https://images.unsplash.com/photo-1536256263959-770b48d82b0a?w=300" }
            ]
        };

        // Verileri localStorage'dan çek veya varsayılanı kullan (Yönetici şifresiyle değişenlerin kalıcı olması için)
        let menuData = JSON.parse(localStorage.getItem('seyirCafeMenu')) || defaultMenuData;
        let activeCategory = Object.keys(menuData)[0]; // İlk kategori varsayılan seçili

        const categoryContainer = document.getElementById('categoryContainer');
        const productGrid = document.getElementById('productGrid');
        const cafeSubtitle = document.getElementById('cafeSubtitle');

        // Alt yazıyı kaydetme
        cafeSubtitle.addEventListener('input', () => {
            localStorage.setItem('seyirCafeSubtitle', cafeSubtitle.innerText);
        });

        // Kayıtlı alt yazıyı yükle
        if(localStorage.getItem('seyirCafeSubtitle')) {
            cafeSubtitle.innerText = localStorage.getItem('seyirCafeSubtitle');
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            Object.keys(menuData).forEach((cat, index) => {
                const btn = document.createElement('button');
                btn.className = `category-btn ${cat === activeCategory ? 'active' : ''}`;
                btn.innerText = cat;
                btn.onclick = () => {
                    activeCategory = cat;
                    renderCategories();
                    renderProducts();
                };
                categoryContainer.appendChild(btn);
            });
        }

        function renderProducts() {
            productGrid.innerHTML = '';
            const products = menuData[activeCategory] || [];
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <span class="product-price">${product.price}</span>
                    <img src="${product.image}" alt="${product.name}" class="product-image">
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                    </div>
                `;
                productGrid.appendChild(card);
            });
        }

        // Yönetici Modu Kontrolü (Şifre ile değişiklikleri kalıcı kaydetme simülasyonu)
        function toggleAdminMode() {
            const pwd = prompt("Yönetici şifresini giriniz:");
            if (pwd === "1234") { // Örnek şifre
                alert("Yönetici girişi başarılı! Değişiklikler kalıcı olarak kaydedilecektir.");
                // Burada veri güncelleme paneli aktif edilebilir.
                localStorage.setItem('seyirCafeMenu', JSON.stringify(menuData));
            } else if(pwd !== null) {
                alert("Hatalı şifre!");
            }
        }

        // İlk Yükleme
        renderCategories();
        renderProducts();
    </script>
</body>
</html>
