<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seyir Cafe</title>
    <!-- Tabeladaki süslü ve karakteristik havaya uygun Google Font bağlantısı -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Tabelayı tutan direk üzerindeki deseni andıran zarif, koyu tonlu arka plan motifi */
            background-color: #1a0f0d;
            background-image: radial-gradient(circle, #2d1815 10%, #1a0f0d 90%),
                              repeating-linear-gradient(45deg, rgba(212, 175, 55, 0.03) 0, rgba(212, 175, 55, 0.03) 2px, transparent 0, transparent 50px);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Playfair Display', serif;
            overflow: hidden;
            position: relative;
        }

        /* Direk ve ahşap dokuyu andıran arka plan zarafeti için dekoratif SVG/CSS desen katmanı */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M50 0 C60 20 80 40 100 50 C80 60 60 80 50 100 C40 80 20 60 0 50 C20 40 40 20 50 0 Z" fill="rgba(212, 175, 55, 0.02)"/></svg>');
            opacity: 0.5;
            pointer-events: none;
        }

        .container {
            text-align: center;
            z-index: 2;
            padding: 20px;
        }

        /* Tabela Kutusu (Görseldeki ahşap tabelanın formu) */
        .signboard {
            background: linear-gradient(145deg, #3d2314, #24130a);
            border: 4px solid #d4af37;
            padding: 50px 70px;
            border-radius: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 
                        inset 0 0 30px rgba(0,0,0,0.6),
                        0 0 25px rgba(212, 175, 55, 0.2);
            display: inline-block;
            position: relative;
        }

        /* SEYİR CAFE Yazı Stili */
        .cafe-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 4rem;
            color: #ff3366;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.8),
                         0 0 20px rgba(255, 51, 102, 0.6),
                         0 0 30px rgba(255, 51, 102, 0.4),
                         2px 2px 5px rgba(0,0,0,0.9);
            letter-spacing: 3px;
            line-height: 1.2;
            position: relative;
        }

        .cafe-subtitle {
            font-family: 'Cinzel Decorative', serif;
            font-size: 3.2rem;
            color: #ff3366;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.8),
                         0 0 20px rgba(255, 51, 102, 0.6),
                         2px 2px 5px rgba(0,0,0,0.9);
            margin-top: 10px;
            letter-spacing: 5px;
        }

        /* İ harfinin üzerindeki kalp ve AŞIRI YAVAŞ yanıp sönme efekti (pulse) */
        .heart-dot {
            position: absolute;
            top: -35px;
            right: 48px; /* SEYİR kelimesindeki İ'nin üzerine denk gelecek şekilde ayarlandı */
            width: 25px;
            height: 25px;
            background-color: #ff3366;
            transform: rotate(-45deg);
            box-shadow: 0 0 15px #ff3366, 0 0 30px #ff3366;
            /* Süreyi 6 saniye yaparak İSTEDİĞİN GİBİ AŞIRI YAVAŞ bir nefes alıp verme efekti sağladık */
            animation: ultraSlowBlink 6s infinite ease-in-out;
        }

        .heart-dot::before,
        .heart-dot::after {
            content: "";
            position: absolute;
            width: 25px;
            height: 25px;
            background-color: #ff3366;
            border-radius: 50%;
        }

        .heart-dot::before {
            top: -12.5px;
            left: 0;
        }

        .heart-dot::after {
            left: 12.5px;
            top: 0;
        }

        @keyframes ultraSlowBlink {
            0%, 100% {
                opacity: 0.2;
                transform: rotate(-45deg) scale(0.9);
                box-shadow: 0 0 5px rgba(255, 51, 102, 0.2);
            }
            50% {
                opacity: 1;
                transform: rotate(-45deg) scale(1.1);
                box-shadow: 0 0 25px rgba(255, 51, 102, 1), 0 0 40px rgba(255, 51, 102, 0.8);
            }
        }

        /* Haritaya hızlı geçiş için alt bilgi butonu */
        .map-link {
            margin-top: 30px;
            display: inline-block;
            color: #d4af37;
            text-decoration: none;
            border: 1px solid #d4af37;
            padding: 10px 20px;
            border-radius: 20px;
            transition: 0.3s;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .map-link:hover {
            background-color: #d4af37;
            color: #1a0f0d;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="signboard">
            <div class="cafe-title">
                SEYİR
                <!-- İ harfinin üstündeki kalp (Aşırı yavaş yanıp sönen) -->
                <div class="heart-dot"></div>
            </div>
            <div class="cafe-subtitle">CAFE</div>
        </div>
        
        <div>
            <a href="https://maps.app.goo.gl/FED3WD1ZsCH7DEUh7" target="_blank" class="map-link">📍 Konumumuzu Ziyaret Edin</a>
        </div>
    </div>

</body>
</html>
