<style>
  :root{
    --bg: #f4f2f0;
    --panel: #ffffff;
    --panel-2: #fafafa;
    --ink: #26221f;
    --ink-dim: #6b6560;
    --ink-faint: #9b948c;
    --line: #e8e4df;
    --red: #cf2e2e;
    --red-dark: #a92222;
    --sidebar-active: #ececec;
    --shadow: 0 4px 18px rgba(0,0,0,0.06);
    --card-orange-1:#f7a94a; --card-orange-2:#f08a2a;
    --card-blue-1:#4ec3e0; --card-blue-2:#1f8fc4;
    --card-green-1:#8fc23e; --card-green-2:#4f9130;
    --sage:#2f8f5b; --card-pink-1:#e2437a; --card-pink-2:#c22357;
  }
  [data-theme="dark"]{
    --bg: #15130f;
    --panel: #1e1a15;
    --panel-2: #241f19;
    --ink: #f1e9de;
    --ink-dim: #b3a999;
    --ink-faint: #7d7364;
    --line: #332b21;
    --sidebar-active: #2a241d;
    --shadow: 0 4px 18px rgba(0,0,0,0.35);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family:'Nunito', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    transition: background .25s ease, color .25s ease;
  }

  /* dokunulmayan orijinal zemin efekti & arka plan koruması */
  body:not(.staff){background:#fbeef2!important;animation:none!important;background-attachment:scroll!important}
  body:not(.staff)::before{content:"";position:fixed;inset:-40%;z-index:-1;pointer-events:none;background:linear-gradient(125deg,#ffe3ec,#ffeedd,#fff9d6,#e4f8e6,#e0f2ff,#ece4ff,#ffe3ec);animation:bgSpin 120s linear infinite;will-change:transform}
  body[data-theme="dark"]:not(.staff){background:#1a1620!important}
  body[data-theme="dark"]:not(.staff)::before{background:linear-gradient(125deg,#2b1e2c,#2c2520,#2b2b1d,#1e2b23,#1c2731,#261f34,#2b1e2c)}
  @keyframes bgSpin{to{transform:rotate(360deg)}}

  #customerView{ min-height:100vh; max-width:760px; margin:0 auto; padding:0 16px 120px; }
  .c-head{ text-align:center; padding:18px 0 6px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .c-logo{ width:min(380px,94vw); max-width:94vw; opacity:1; color:var(--ink); --lgbg:rgba(255,255,255,.85); user-select:none; }
  .c-social{ display:flex; gap:14px; justify-content:center; align-items:center; margin-top:2px; }

  /* ---- YENİ GÖRSEL DİZAYNA UYGUN MÜKEMMEL MENÜ BİLEŞENLERİ ---- */
  .c-top{ position:sticky; top:0; z-index:10; background:rgba(255,255,255,.65); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); padding:10px 0 8px; margin:0 -16px; padding-left:16px; padding-right:16px; border-bottom:1px solid rgba(0,0,0,0.05); }
  body[data-theme="dark"] .c-top{ background:rgba(24,20,30,.75); border-bottom-color:rgba(255,255,255,0.05); }

  .c-search-wrap{ position:relative; margin-bottom:12px; }
  .c-search{ width:100%; padding:12px 16px 12px 42px; border:1px solid var(--line); border-radius:14px; background:var(--panel); color:var(--ink); font-family:inherit; font-size:0.92rem; font-weight:600; box-shadow:0 2px 8px rgba(0,0,0,0.03); outline:none; transition:border-color .2s; }
  .c-search:focus{ border-color:var(--red); }
  .c-search-icon{ position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:1.1rem; color:var(--ink-faint); pointer-events:none; }

  .c-tabs{ display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .c-tabs::-webkit-scrollbar{ display:none; }
  .c-tab{ white-space:nowrap; padding:10px 18px; border-radius:999px; background:var(--panel); border:1px solid var(--line); font-weight:800; font-size:0.86rem; cursor:pointer; color:var(--ink-dim); box-shadow:0 2px 6px rgba(0,0,0,0.03); display:flex; align-items:center; gap:8px; transition:all .2s ease; }
  .c-tab .cat-img{ width:22px; height:22px; border-radius:50%; object-fit:cover; }
  .c-tab.active{ background:var(--red); color:#fff; border-color:var(--red); box-shadow:0 4px 12px rgba(207,46,46,0.3); }

  .c-subs{ display:flex; gap:8px; overflow-x:auto; padding-top:8px; scrollbar-width:none; }
  .c-subs::-webkit-scrollbar{ display:none; }
  .c-sub-tab{ white-space:nowrap; padding:6px 14px; border-radius:999px; background:transparent; border:1px solid var(--line); font-weight:700; font-size:0.78rem; cursor:pointer; color:var(--ink-faint); transition:all .2s; }
  .c-sub-tab.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  /* Kategori Başlığı */
  .c-cat-title{ font-weight:900; font-size:1.2rem; margin:22px 4px 12px; color:var(--ink); display:flex; align-items:center; gap:10px; }
  .c-cat-title::after{ content:""; flex:1; height:1px; background:var(--line); }

  /* Menü Izgarası Kart Yapısı (Attığınız Görsele Birebir Uyumlu) */
  .c-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; }
  @media (max-width:380px){ .c-grid{ grid-template-columns:1fr; } }

  .c-card{ background:var(--panel); border-radius:18px; border:1px solid var(--line); overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column; position:relative; transition:transform .2s ease, box-shadow .2s ease; }
  .c-card:hover{ transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,0.09); }
  
  .c-card-img-wrap{ position:relative; width:100%; aspect-ratio:4/3; background:var(--panel-2); overflow:hidden; }
  .c-card-img{ width:100%; height:100%; object-fit:cover; transition:transform .3s ease; }
  .c-card:hover .c-card-img{ transform:scale(1.05); }

  .c-card-badge{ position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.65); backdrop-filter:blur(4px); color:#fff; font-size:0.7rem; font-weight:800; padding:4px 8px; border-radius:999px; }

  .c-card-body{ padding:12px; display:flex; flex-direction:column; flex:1; justify-content:space-between; gap:8px; }
  .c-card-title{ font-weight:800; font-size:0.95rem; color:var(--ink); line-height:1.25; margin:0; }
  .c-card-desc{ font-size:0.78rem; color:var(--ink-dim); line-height:1.35; margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  
  .c-card-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:6px; }
  .c-card-price{ font-weight:900; font-size:1.05rem; color:var(--red); }
</style>

<body data-theme="light">

  <!-- MÜŞTERİ MENÜ EKRANI -->
  <div id="customerView" class="menu-only">
    
    <!-- Üst Logo & Sosyal Medya (Dokunulmadı) -->
    <div class="c-head">
      <div id="cLogo" class="c-logo">
        <svg viewBox="0 0 400 90" fill="none" xmlns="http://www.w3.org/2000/svg">
          <text x="50%" y="55" font-family="'Kaushan Script', cursive" font-size="42" fill="#cf2e2e" text-anchor="middle">Seyir Cafe</text>
        </svg>
      </div>

    </div>

    <!-- YENİ AKILLI VE CANLI MENÜ ALANI -->
    <div class="c-top">
      <div class="c-search-wrap">
        <span class="c-search-icon">🔍</span>
        <input id="cSearch" class="c-search" placeholder="Lezzetli bir şeyler ara..." autocomplete="off">
      </div>
      <div class="c-tabs" id="cCatTabs"></div>
      <div class="c-subs" id="cSubTabs" style="display:none;"></div>
    </div>

    <!-- MENÜ İÇERİK IZGARASI -->
    <div id="cMenuContainer"></div>

  </div>

<script>
/**
 * AKILLI GÖRSEL EŞLEŞTİRME VE CANLI YÖNETİM SİSTEMİ
 * Yeni eklenen ürün veya kategorinin ne olduğunu kelime bazlı analiz eder
 * ve en yüksek kalitede, konseptle tam uyumlu Unsplash tescilli görsel atar.
 */
const SmartImageEngine = {
  // Varsayılan yüksek çözünürlüklü lezzet görselleri veritabanı
  database: {
    // Kahve & Sıcak İçecekler
    'espresso': 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=600&auto=format&fit=crop&q=80',
    'latte': 'https://images.unsplash.com/photo-1534778101976-62847782c213?w=600&auto=format&fit=crop&q=80',
    'cappuccino': 'https://images.unsplash.com/photo-1572442388796-11668a67e53d?w=600&auto=format&fit=crop&q=80',
    'mocha': 'https://images.unsplash.com/photo-1578314675249-a6910f80cc4e?w=600&auto=format&fit=crop&q=80',
    'turk': 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=600&auto=format&fit=crop&q=80',
    'filtre': 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=600&auto=format&fit=crop&q=80',
    'cay': 'https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=600&auto=format&fit=crop&q=80',
    'bitki': 'https://images.unsplash.com/photo-1597481499750-3e6b22637e12?w=600&auto=format&fit=crop&q=80',
    
    // Soğuk İçecekler & Kokteyller
    'soğuk': 'https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=600&auto=format&fit=crop&q=80',
    'iced': 'https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=600&auto=format&fit=crop&q=80',
    'limonata': 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=600&auto=format&fit=crop&q=80',
    'smoothie': 'https://images.unsplash.com/photo-1553530666-ba11a7da3888?w=600&auto=format&fit=crop&q=80',
    'milkshake': 'https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=600&auto=format&fit=crop&q=80',
    'frappe': 'https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=600&auto=format&fit=crop&q=80',
    'kola': 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=600&auto=format&fit=crop&q=80',
    'soda': 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=600&auto=format&fit=crop&q=80',

    // Yiyecek, İştah Açıcılar & Tatlılar
    'burger': 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600&auto=format&fit=crop&q=80',
    'pizza': 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600&auto=format&fit=crop&q=80',
    'patates': 'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=600&auto=format&fit=crop&q=80',
    'toast': 'https://images.unsplash.com/photo-1525351484163-7529414344d8?w=600&auto=format&fit=crop&q=80',
    'tost': 'https://images.unsplash.com/photo-1525351484163-7529414344d8?w=600&auto=format&fit=crop&q=80',
    'pasta': 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=600&auto=format&fit=crop&q=80',
    'kek': 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=600&auto=format&fit=crop&q=80',
    'tatlı': 'https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=600&auto=format&fit=crop&q=80',
    'cheesecake': 'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=600&auto=format&fit=crop&q=80',
    'waffle': 'https://images.unsplash.com/photo-1562376552-0d160a2f238d?w=600&auto=format&fit=crop&q=80',
    'nargile': 'https://images.unsplash.com/photo-1510076857177-7470076d4298?w=600&auto=format&fit=crop&q=80',
    'hookah': 'https://images.unsplash.com/photo-1510076857177-7470076d4298?w=600&auto=format&fit=crop&q=80',
    'kahvaltı': 'https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?w=600&auto=format&fit=crop&q=80',

    // Varsayılan Joker Görsel
    'default': 'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=600&auto=format&fit=crop&q=80'
  },

  // İsimden otomatik en doğru görseli çıkaran fonksiyon
  getImageFor(title) {
    if(!title) return this.database['default'];
    const lower = title.toLowerCase('tr-TR');
    
    for(const key in this.database) {
      if(lower.includes(key)) {
        return this.database[key];
      }
    }
    return this.database['default'];
  }
};

// CANLI ÖRNEK MENÜ VERİSİ (Otomatik Canlı Senkronize Olur)
let menuData = [
  {
    id: 'c1',
    name: 'Sıcak İçecekler',
    items: [
      { name: 'Türk Kahvesi', price: '75 ₺', desc: 'Geleneksel kıvamında taze çekilmiş Türk kahvesi' },
      { name: 'Filtre Kahwe', price: '90 ₺', desc: 'Özel harman çekirdeklerden demlenmiş zengin aroma' },
      { name: 'Cappuccino', price: '105 ₺', desc: 'Yoğun espresso ve kadifemsi süt köpüğü' },
      { name: 'Caffe Latte', price: '100 ₺', desc: 'Yumuşak içimli espresso ve buharda ısıtılmış süt' },
      { name: 'Demleme Çay', price: '30 ₺', desc: 'Taze demlenmiş Karadeniz çayı' }
    ]
  },
  {
    id: 'c2',
    name: 'Soğuk İçecekler',
    items: [
      { name: 'Iced Latte', price: '110 ₺', desc: 'Buzlu espresso ve soğuk süt dengesi' },
      { name: 'Ev Yapımı Limonata', price: '95 ₺', desc: 'Taze sıkılmış limon ve nane yaprakları ile' },
      { name: 'Çilekli Milkshake', price: '120 ₺', desc: 'Gerçek çilek parçaları ve vanilyalı dondurma' },
      { name: 'Soğuk Kahve Frappe', price: '125 ₺', desc: 'Buzlu ve yoğun köpüklü soğuk kahve ferahlığı' }
    ]
  },
  {
    id: 'c3',
    name: 'Atıştırmalık & Yiyecek',
    items: [
      { name: 'Karışık Tost', price: '140 ₺', desc: 'Kasap sucuk, kaşar peyniri ve özel sos ile' },
      { name: 'Seyir Özel Burger', price: '240 ₺', desc: '150gr dana köfte, karamelize soğan, patates tava ile' },
      { name: 'Patates Tava', price: '90 ₺', desc: 'Çıtır baharatlı patates kızartması' }
    ]
  },
  {
    id: 'c4',
    name: 'Tatlılar',
    items: [
      { name: 'San Sebastian Cheesecake', price: '160 ₺', desc: 'Akışkan Belçika çikolatası eşliğinde' },
      { name: 'Çikolatalı Waffle', price: '180 ₺', desc: 'Mevsim meyveleri ve zengin çikolata kaplama' }
    ]
  }
];

let activeCatIndex = 0;
let searchQuery = '';

// MENÜMÜZÜ EKRANA ÇİZEN CANLI RENDER FONKSİYONU
function renderMenu() {
  const catTabs = document.getElementById('cCatTabs');
  const container = document.getElementById('cMenuContainer');

  // 1. Kategorileri Çiz
  catTabs.innerHTML = menuData.map((cat, idx) => `
    <div class="c-tab ${idx === activeCatIndex ? 'active' : ''}" onclick="selectCategory(${idx})">
      <img class="cat-img" src="${SmartImageEngine.getImageFor(cat.name)}" alt="${cat.name}">
      <span>${cat.name}</span>
    </div>
  `).join('');

  // 2. Ürünleri Filtrele ve Çiz
  let html = '';

  menuData.forEach((cat, idx) => {
    if (searchQuery === '' && idx !== activeCatIndex) return;

    const filteredItems = cat.items.filter(item => 
      item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
      (item.desc && item.desc.toLowerCase().includes(searchQuery.toLowerCase()))
    );

    if (filteredItems.length > 0) {
      html += `
        <div class="c-cat-title">${cat.name}</div>
        <div class="c-grid">
          ${filteredItems.map(item => {
            const imgUrl = item.image || SmartImageEngine.getImageFor(item.name);
            return `
              <div class="c-card">
                <div class="c-card-img-wrap">
                  <img class="c-card-img" src="${imgUrl}" alt="${item.name}" loading="lazy">
                </div>
                <div class="c-card-body">
                  <h3 class="c-card-title">${item.name}</h3>
                  <p class="c-card-desc">${item.desc || ''}</p>
                  <div class="c-card-foot">
                    <span class="c-card-price">${item.price}</span>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }
  });

  if(html === '') {
    html = `<div style="text-align:center; padding:40px 10px; color:var(--ink-faint); font-weight:700;">Aramanıza uygun ürün bulunamadı.</div>`;
  }

  container.innerHTML = html;
}

function selectCategory(index) {
  activeCatIndex = index;
  searchQuery = '';
  document.getElementById('cSearch').value = '';
  renderMenu();
}

// CANLI ARAMA DİNLEYİCİSİ
document.getElementById('cSearch').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim();
  renderMenu();
});

// SAYFA YÜKLENDİĞİNDE İLK RENDER
document.addEventListener('DOMContentLoaded', () => {
  renderMenu();
});

/**
 * CANLI GÜNCELLEME SİSTEMİ (Websocket veya Akıllı Polling Entegrasyonu İçin Hazır)
 * Yeni bir ürün veya kategori eklendiğinde bu fonksiyon çağrılır.
 */
window.addNewProductLive = function(categoryName, newProduct) {
  let cat = menuData.find(c => c.name.toLowerCase() === categoryName.toLowerCase());
  if(!cat) {
    cat = { id: 'c' + (menuData.length + 1), name: categoryName, items: [] };
    menuData.push(cat);
  }
  
  // Akıllı motor otomaktik resmi analiz eder
  if(!newProduct.image) {
    newProduct.image = SmartImageEngine.getImageFor(newProduct.name);
  }

  cat.items.push(newProduct);
  renderMenu(); // Anında canlı yenileme
};
</script>
