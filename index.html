<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16191b">
<meta name="color-scheme" content="dark">
<title>Cafe Bey 3D yerleşim planı</title>
<style>
  :root { --bg:#16191b; --panel:#1f2326; --line:#3a4044; --text:#ece8df; --mute:#9aa0a3; --amber:#e8a94a;
          --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px); --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden;
    overscroll-behavior:none; -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  #c:active { cursor:grabbing; }
  #bar { position:fixed; left:calc(12px + var(--sl)); right:calc(12px + var(--sr)); bottom:calc(12px + var(--sb)); display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 14px; font:inherit; font-size:14px; cursor:pointer; touch-action:manipulation; white-space:nowrap; }
  @media (hover:hover) { button:hover { border-color:var(--amber); } }
  button:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
  button[aria-pressed="true"] { background:var(--amber); color:#1b1408; border-color:var(--amber); }
  .sep { width:1px; background:var(--line); margin:0 4px; }
  #tLeg { display:none; }
  #head { position:fixed; left:calc(14px + var(--sl)); right:calc(14px + var(--sr)); top:calc(12px + var(--st)); pointer-events:none; }
  #head h1 { margin:0; font-size:18px; font-weight:600; }
  #head p { margin:2px 0 0; font-size:13px; color:var(--mute); }
  .lbl { position:fixed; left:0; top:0; transform:translate(-50%,-50%); will-change:transform; font-size:12px; padding:2px 7px; border-radius:6px; background:rgba(22,25,27,.82); border:1px solid var(--line); pointer-events:none; white-space:nowrap; }
  #legend { position:fixed; right:calc(12px + var(--sr)); top:calc(12px + var(--st)); background:rgba(31,35,38,.9); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:12px; line-height:1.9; }
  #legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:7px; vertical-align:-1px; }

  /* Telefon / küçük ekran: tek satır kaydırmalı buton çubuğu, açılır renk göstergesi */
  @media (max-width:760px), (max-height:500px) {
    #head h1 { font-size:16px; }
    #head p { font-size:12px; }
    #bar { flex-wrap:nowrap; justify-content:flex-start; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; touch-action:pan-x; -webkit-overflow-scrolling:touch; }
    #bar::-webkit-scrollbar { display:none; }
    #bar::before, #bar::after { content:''; margin:auto; flex:none; }
    #bar > * { flex:none; }
    button { padding:8px 12px; font-size:13px; }
    #tLeg { display:inline-block; }
    #legend { display:none; right:auto; top:auto; left:calc(12px + var(--sl)); bottom:calc(68px + var(--sb)); }
    #legend.show { display:block; }
    .lbl { font-size:11px; padding:1px 6px; }
  }
  @media (max-height:500px) { #head p { display:none; } }
  @media (pointer:coarse) { button { min-height:44px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="head"><h1>Cafe Bey</h1><p id="hint">Sürükle: döndür · Tekerlek / iki parmak: yakınlaştır · Sağ tık: kaydır</p></div>
<div id="legend">
  <div><i style="background:#9ad4bf"></i>Oturma alanı</div>
  <div><i style="background:#a79ff0"></i>Nargile odası</div>
  <div><i style="background:#e58a6b"></i>Bar + mutfak</div>
  <div><i style="background:#9a9b98"></i>WC</div>
  <div><i style="background:#2f7d52"></i>Okey alanı</div>
  <div><i style="background:#3a3a3a"></i>Kullanım dışı</div>
</div>
<div id="bar">
  <button data-v="persp">Perspektif</button>

  <button data-v="street">Sokaktan</button>
  <button data-v="back">Arkadan</button>
  <span class="sep"></span>
  <button id="tRoof" aria-pressed="false">Çatıyı aç</button>
  <button id="tWin" aria-pressed="false">Camları aç</button>
  <button id="tInt" aria-pressed="true">İç mekan</button>
  <button id="tBld" aria-pressed="true">Bina</button>
  <button id="tLbl" aria-pressed="true">Etiketler</button>
  <button id="tLeg" aria-pressed="false">Renkler</button>
</div>

const M = (c,o=1) => new THREE.MeshLambertMaterial({color:c,transparent:o<1,opacity:o,side:THREE.DoubleSide,depthWrite:o>=1});
const mats = {
  wall:M(0xe9e4d9), outer:M(0xd2ccbf), glass:M(0x9fc4d8,.28), frame:M(0x23272a),
  floorOpen:M(0xbfd9cc), floorIn:M(0xe6dfd0), shaft:M(0x3a3a3a),
  purple:M(0xa79ff0), coral:M(0xe58a6b), coralD:M(0x993c1d), gray:M(0x9a9b98), col:M(0xf4f1ea)
};
function box(x0,z0,x1,z1,y0,y1,mat,parent=scene){
  const m = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(X(x1)-X(x0)),y1-y0,Math.abs(Z(z1)-Z(z0))),mat);
  m.position.set((X(x0)+X(x1))/2,(y0+y1)/2,(Z(z0)+Z(z1))/2);
  parent.add(m); return m;
}
const T = 0.1/S;
function wall(x0,y0,x1,y1,mat,h=3.2,yb=0,t=T,parent=scene){
  if(y0===y1) return box(x0,y0-t,x1,y0+t,yb,yb+h,mat,parent);
  return box(x0-t,y0,x0+t,y1,yb,yb+h,mat,parent);
}

const sl = box(207.5,152.5,342.5,507.5,3.2,3.4,M(0xf0ece4,.3));

const interior=new THREE.Group(); scene.add(interior);
const D=new THREE.Object3D(), pm=(x,y)=>[X(x),Z(y)];
function inst(geo,mat,list){
  const m=new THREE.InstancedMesh(geo,mat,list.length);
  list.forEach((a,i)=>{D.position.set(a[0],a[1],a[2]);D.rotation.set(0,0,0);D.updateMatrix();m.setMatrixAt(i,D.matrix);});
  interior.add(m);
}
const MB=(c)=>new THREE.MeshLambertMaterial({color:c});
const ib=(x0,y0,x1,y1,h0,h1,c)=>box(x0,y0,x1,y1,h0,h1,MB(c),interior);

const tabs=[];
for(let y=60;y<=590;y+=44){ if(Math.abs(y-225)<24||Math.abs(y-452)<24) continue; [72,122,172].forEach(x=>tabs.push([x,y])); }
[[228,182],[262,182],[225,262],[272,262],[230,312],[231,388]].forEach(t=>tabs.push(t));
const tp=tabs.map(t=>pm(t[0],t[1]));

inst(new THREE.CylinderGeometry(.05,.05,.75,8),MB(0x2b2f33),tp.map(p=>[p[0],.375,p[1]]));

tp.forEach(p=>{
  [[.72,0],[-.72,0],[0,.72],[0,-.72]].forEach(o=>seats.push([p[0]+o[0],.45,p[1]+o[1]]));
  bx.push([p[0]+.92,.7,p[1]],[p[0]-.92,.7,p[1]]); bz.push([p[0],.7,p[1]+.92],[p[0],.7,p[1]-.92]);

});

const labels=[

const MAXR=220;
// w: görünümün yatayda sığması gereken yaklaşık dünya genişliği (dikey/portre ekranlarda otomatik uzaklaşmak için)
const views={persp:{az:-1.0,el:0.62,r:62,w:56},top:{az:0,el:1.5,r:68,w:32},street:{az:-1.57,el:0.2,r:40,w:56},back:{az:1.9,el:0.35,r:40,w:58}};
let curView='persp', moved=false;
const asp=()=>(cv.clientWidth||innerWidth)/(cv.clientHeight||innerHeight);
function getView(n){
  const v=views[n], a=asp();
  const r=Math.min(MAXR,Math.max(v.r,v.w*0.9/(0.83*a)));
  const az=(n==='persp'&&a<0.8)?-0.55:v.az;
  return {az,el:v.el,r,tx:target.x,tz:target.z};
}
const st={...getView('persp')};
const goal={...st};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{curView=b.dataset.v;moved=false;Object.assign(goal,getView(curView));});
function tog(id,fn){const b=document.getElementById(id);b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);fn(on);};}
let roofG=0,winG=0,roofT=0,winT=0;
tog('tRoof',o=>{roofG=o?1:0;document.getElementById('tRoof').textContent=o?'Çatıyı kapat':'Çatıyı aç';});
tog('tWin',o=>{winG=o?1:0;document.getElementById('tWin').textContent=o?'Camları kapat':'Camları aç';});
tog('tInt',o=>interior.visible=o); tog('tBld',o=>bld.visible=o); tog('tLbl',o=>labels.forEach(l=>l.el.style.display=o?'':'none'));
tog('tLeg',o=>document.getElementById('legend').classList.toggle('show',o));
document.getElementById('hint').textContent=coarse?'Sürükle: döndür · İki parmak: yakınlaştır ve kaydır':'Sürükle: döndür · Tekerlek / iki parmak: yakınlaştır · Sağ tık: kaydır';

const ptrs=new Map(); let pd=0,pmx=null,pmy=null;
function panBy(dx,dy){
  const k=goal.r*0.0016;
  goal.tx+=(-Math.cos(goal.az)*dx+Math.sin(goal.az)*dy*Math.sin(goal.el))*k;
  goal.tz+=( Math.sin(goal.az)*dx+Math.cos(goal.az)*dy*Math.sin(goal.el))*k;
  goal.tx=clamp(goal.tx,target.x-45,target.x+45); goal.tz=clamp(goal.tz,target.z-45,target.z+45);
}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button,s:e.shiftKey});pd=0;pmx=null;});
const endPtr=e=>{ptrs.delete(e.pointerId);pd=0;pmx=null;};
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId); if(!p) return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y;
  moved=true;
  if(ptrs.size===2){
    // iki parmak: yakınlaştır + kaydır
    const o=[...ptrs.entries()].find(a=>a[0]!==e.pointerId)[1];
    const nd=Math.hypot(e.clientX-o.x,e.clientY-o.y);
    const mx=(e.clientX+o.x)/2, my=(e.clientY+o.y)/2;
    if(pd&&nd>0) goal.r=clamp(goal.r*pd/nd,8,MAXR);
    if(pmx!==null) panBy(mx-pmx,my-pmy);
    pd=nd; pmx=mx; pmy=my;
  } else if(p.b===2||p.s){ panBy(dx,dy); }
  else { goal.az-=dx*0.006; goal.el=clamp(goal.el+dy*0.006,0.05,1.55); }
  p.x=e.clientX; p.y=e.clientY;
});
cv.addEventListener('wheel',e=>{e.preventDefault();moved=true;goal.r=clamp(goal.r*(1+e.deltaY*0.001),8,MAXR);},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

let W=innerWidth,H=innerHeight;
function resize(){
  W=cv.clientWidth||innerWidth; H=cv.clientHeight||innerHeight;
  renderer.setSize(W,H,false); cam.aspect=W/H; cam.updateProjectionMatrix();
  if(!moved){ const v=getView(curView); Object.assign(goal,v); }
}
if('ResizeObserver' in window) new ResizeObserver(resize).observe(cv); else addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,250));
resize();

const v3=new THREE.Vector3(); let lastT=performance.now();
(function loop(){
  requestAnimationFrame(loop);
  for(const k of ['az','el','r','tx','tz']) st[k]+=(goal[k]-st[k])*0.12;
  cam.position.set(st.tx+st.r*Math.cos(st.el)*Math.sin(st.az), st.r*Math.sin(st.el), st.tz+st.r*Math.cos(st.el)*Math.cos(st.az));
  const nowT=performance.now(), dt=Math.min(0.05,(nowT-lastT)/1000); lastT=nowT;
  roofT+=clamp(roofG-roofT,-dt/3.5,dt/3.5); winT+=(winG-winT)*0.06;
  // roofT: 0 = kapalı, 1 = açık. Açılırken önce giriş tarafındaki panel çekilir, kapanırken arkadakiler önce uzanır, en son giriş tarafı kapanır
  slats.forEach(m=>{
    const u=m.userData, d=u.i/(nS-1)*0.55;
    const f=clamp((roofT-d)/0.45,0,1), e=f*f*(3-2*f);
    m.position.x=u.cx+(u.ox-u.cx)*e;
    m.position.y=3.3+(nS-1-u.i)*0.07*Math.min(1,f*6);
  });
  wins.forEach(w=>w.scale.y=Math.max(0.02,1-winT));
  cam.up.set(0,1,0); cam.lookAt(st.tx,0,st.tz);
  renderer.render(scene,cam);
  labels.forEach(l=>{
    v3.copy(l.p).project(cam);
    const ok=v3.z<1&&Math.abs(v3.x)<1.1&&Math.abs(v3.y)<1.1;
    l.el.style.visibility=ok?'visible':'hidden';
    l.el.style.transform='translate('+((v3.x+1)/2*W)+'px,'+((1-v3.y)/2*H)+'px) translate(-50%,-50%)';
  });
})();
</script>
</body>
</html>
