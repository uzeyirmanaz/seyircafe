<style>
  :root {
    --bg-color: #0b0b0e;
    --card-bg: rgba(20, 20, 25, 0.95);
    --gold: #d4af37;
    --gold-light: #f5e5c0;
    --gold-glow: rgba(212, 175, 55, 0.4);
    --text-color: #e0e0e0;
    --text-muted: #a0a0a0;
    --danger: #e74c3c;
  }

  html, body {
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: 'Montserrat', sans-serif;
    background-image: radial-gradient(circle at 50% 0%, #1a150a 0%, #0b0b0e 80%);
  }

  * { box-sizing: border-box !important; }

  .container { 
    width: 100% !important;
    max-width: 600px;
    padding: 15px 12px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .header { 
    text-align: center; 
    padding: 20px 0 15px 0; 
    border-bottom: 1px solid rgba(212, 175, 55, 0.2); 
    margin-bottom: 15px; 
    animation: fadeInDown 0.8s ease;
  }
  .header h1 { 
    font-family: 'Cinzel', serif; 
    font-size: 2.5rem; 
    font-weight: 900;
    letter-spacing: 3px; 
    text-transform: uppercase;
    margin: 0;
    text-shadow: 0 0 20px var(--gold-glow);
    background: linear-gradient(180deg, #fff 0%, var(--gold) 60%, #997a15 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header p { 
    font-size: 0.8rem; 
    letter-spacing: 2px; 
    color: var(--gold-light); 
    margin-top: 8px; 
    text-transform: uppercase; 
  }

  .social-links { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
  .social-icon {
    width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--gold);
    background: rgba(212, 175, 55, 0.1); color: var(--gold);
    display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 1.1rem;
    transition: all 0.3s;
  }
  .social-icon:hover { background: var(--gold); color: #000; transform: scale(1.1); }

  /* Kategoriler */
  .categories-bar {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 12px;
    margin-bottom: 15px;
    scrollbar-width: none;
    animation: fadeIn 1s ease;
  }
  .categories-bar::-webkit-scrollbar { display: none; }
  
  .cat-btn {
    position: relative;
    background-size: cover;
    background-position: center;
    border: 1px solid rgba(212, 175, 55, 0.3);
    color: var(--text-color);
    padding: 12px 20px;
    border-radius: 12px;
    white-space: nowrap;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.3s;
  }
  .cat-btn::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(10, 10, 12, 0.75);
    z-index: 1;
    transition: background 0.3s;
  }
  .cat-btn span {
    position: relative;
    z-index: 2;
  }
  .cat-btn.active {
    border-color: var(--gold);
    box-shadow: 0 0 15px var(--gold-glow);
    transform: scale(1.05);
  }
  .cat-btn.active::before {
    background: rgba(15, 15, 20, 0.4);
  }

  /* Aktif Kategori Başlığı ve Yönetici Kalemi */
  .active-category-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    padding: 0 5px;
  }
  .active-category-title {
    font-family: 'Cinzel', serif;
    font-size: 1.4rem;
    color: var(--gold);
    font-weight: 700;
  }

  /* Ürün Izgarası ve Farklı Animasyonlar */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 14px; }
  .menu-item { 
    background: var(--card-bg); 
    border: 1px solid rgba(212, 175, 55, 0.2); 
    border-radius: 10px; 
    overflow: hidden; 
    display: flex; 
    flex-direction: column; 
    position: relative;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: transform 0.3s;
  }
  .menu-item:hover { transform: translateY(-4px); }

  /* Farklı Animasyon Tanımları */
  .anim-1 { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .anim-2 { animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .anim-3 { animation: slideRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .anim-4 { animation: rotateIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

  @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeInScale { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
  @keyframes slideRight { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes rotateIn { from { opacity: 0; transform: rotate(-5deg) scale(0.9); } to { opacity: 1; transform: rotate(0) scale(1); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

  .item-img-wrapper { position: relative; width: 100%; height: 135px; background: #000; }
  .item-img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s; }
  .item-badge { 
    position: absolute; top: 8px; right: 8px; 
    background: rgba(192, 57, 43, 0.9); color: #fff; 
    font-size: 0.8rem; font-weight: 700; padding: 4px 10px; 
    border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.6); 
  }
  .item-content { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; justify-content: center; background: #131317; text-align: center; }
  .item-title { font-family: 'Cinzel', serif; font-size: 0.9rem; color: var(--gold-light); font-weight: 600; }

  /* Yönetici Hızlı Düzenleme Butonları */
  .admin-controls {
    display: none;
    position: absolute;
    top: 8px; left: 8px;
    gap: 6px;
    z-index: 10;
  }
  body.admin-mode .admin-controls { display: flex; }
  .admin-btn-icon {
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(0, 0, 0, 0.8); border: 1px solid var(--gold);
    color: var(--gold); display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 0.85rem; transition: background 0.2s;
  }
  .admin-btn-icon:hover { background: var(--gold); color: #000; }
  .admin-btn-icon.delete { border-color: var(--danger); color: var(--danger); }
  .admin-btn-icon.delete:hover { background: var(--danger); color: #fff; }

  /* Hızlı Ekleme Butonu (Kategori İçi) */
  .quick-add-section {
    display: none;
    margin-top: 20px;
    background: #18181f;
    border: 1px dashed var(--gold);
    padding: 15px;
    border-radius: 10px;
    text-align: center;
  }
  body.admin-mode .quick-add-section { display: block; }

  .footer { margin-top: auto; padding-top: 35px; text-align: center; border-top: 1px solid rgba(212, 175, 55, 0.1); display: flex; justify-content: space-between; align-items: center; }
  .admin-toggle-btn-bottom { background: transparent; color: #444; border: none; cursor: pointer; font-size: 1.1rem; transition: color 0.3s; }
  .admin-toggle-btn-bottom:hover { color: var(--gold); }

  .login-box { display: none; background: #151518; border: 1px solid var(--gold); padding: 15px; border-radius: 8px; margin-top: 15px; }
  .login-box.open { display: block; }
  .admin-input { background: #0d0d0f; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 6px; width: 100%; margin-bottom: 10px; font-size: 0.9rem; }
  .btn { padding: 10px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.9rem; font-weight: 600; }
  .btn-gold { background: var(--gold); color: #000; }
  .btn-danger { background: var(--danger); color: #fff; }
</style>
</head>
<body id="bodyTag">

<div class="container">
  
  <div class="header">
    <h1>Seyir Cafe</h1>
    <p>Lounge & Gourmet Experience</p>
    
    <div class="social-links">
      <a href="https://www.instagram.com/seyircafe.21" target="_blank" class="social-icon" title="Instagram"><i class="fa-brands fa-instagram"></i></a>

    </div>

  <!-- Kategori Sekmeleri (Arka Plan Görselerli) -->

  <!-- Aktif Kategori Başlığı ve Yönetici Kalemi -->
  <div class="active-category-header">
    <div id="activeCategoryTitle" class="active-category-title">Tümü</div>
    <div id="categoryEditArea"></div>

  <!-- Ürün Listesi Izgarası -->
  <div id="menuGrid" class="grid"></div>

  <!-- Yönetici Modunda Bulunulan Kategoriye Hızlı Ürün Ekleme -->
  <div id="quickAddSection" class="quick-add-section">
    <h4 style="color:var(--gold); margin-bottom:10px; font-family:'Cinzel', serif;" id="quickAddTitle">+ Bu Kategoriye Yeni Ürün Ekle</h4>
    <input type="text" id="qAddName" class="admin-input" placeholder="Ürün Adı">
    <input type="text" id="qAddPrice" class="admin-input" placeholder="Fiyat (Örn: 200 TL)">
    <input type="file" id="qAddFile" class="admin-input" accept="image/*">
    <button class="btn btn-gold" style="width:100%;" onclick="quickAddProductToCurrentCategory()">Ürünü Ekle</button>
  </div>

  <!-- YÖNETİCİ ŞİFRE GİRİŞİ -->
  <div id="loginBox" class="login-box">
    <input type="password" id="passInput" class="admin-input" placeholder="Yönetici Şifreniz (1171)">
    <button class="btn btn-gold" style="width:100%;" onclick="checkPassword()">Yönetici Modunu Aç</button>
    <div id="loginError" style="color:var(--danger); font-size:0.85rem; display:none; margin-top:8px; font-weight:600; text-align:center;"></div>
  </div>

  <div class="footer">
    <span style="font-size: 0.75rem; color: #666;">© Seyir Cafe Dijital Menü</span>
    <button class="admin-toggle-btn-bottom" onclick="toggleLoginBox()" title="Yönetici Paneli"><i class="fa-solid fa-lock" id="lockIcon"></i></button>
  </div>

</div>

  let allProducts = [

    { name: "Salep / Damla Sakızlı Salep", price: "150 TL", category: "Sıcak İçecekler", img: "https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=500&q=80" },
    { name: "Sıcak Çikolata", price: "150 TL", category: "Sıcak İçecekler", img: "https://images.unsplash.com/photo-1542990253-0d0f5be5f0ed?w=500&q=80" },
    { name: "Ballı Süt", price: "120 TL", category: "Sıcak İçecekler", img: "https://images.unsplash.com/photo-1550583724-b2692b85b150?w=500&q=80" },
    { name: "Karadut (Duble)", price: "70 TL", category: "Sıcak İçecekler", img: "https://images.unsplash.com/photo-1597481499750-3e6b22637e12?w=500&q=80" },
    { name: "Çay", price: "30 TL", category: "Sıcak İçecekler", img: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=500&q=80" },

    // Yemek
    { name: "Tavuk Izgara", price: "300 TL", category: "Yemek", img: "https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?w=500&q=80" },
    { name: "Tavuk Şinitzel", price: "300 TL", category: "Yemek", img: "https://images.unsplash.com/photo-1562967914-608f82629710?w=500&q=80" },
    { name: "Tost Sucuklu Kaşarlı", price: "200 TL", category: "Yemek", img: "https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=500&q=80" },
    { name: "Menemen", price: "200 TL", category: "Yemek", img: "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=500&q=80" },
    { name: "Hamburger", price: "250 TL", category: "Yemek", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&q=80" },
    { name: "Kiremitte Kaşarlı Köfte", price: "350 TL", category: "Yemek", img: "https://images.unsplash.com/photo-1529042410759-befb1204b468?w=500&q=80" },

    // Espresso & Kahveler
    { name: "Filtre Kahve", price: "130 TL", category: "Espresso", img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500&q=80" },
    { name: "Beyaz Çikolata Latte", price: "130 TL", category: "Espresso", img: "https://images.unsplash.com/photo-1570968915860-54d5c301fa9f?w=500&q=80" },
    { name: "Americano", price: "130 TL", category: "Kahve", img: "https://images.unsplash.com/photo-1551033406-611cf9a28f67?w=500&q=80" },
    { name: "Cappuccino", price: "130 TL", category: "Kahve", img: "https://images.unsplash.com/photo-1572442388796-11668a67e53d?w=500&q=80" },
    { name: "Türk Kahvesi", price: "120 TL", category: "Kahve", img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500&q=80" },

    // Frozen
    { name: "Mango Frozen", price: "200 TL", category: "Frozen", img: "https://images.unsplash.com/photo-1534353473418-4cfa6c56fd38?w=500&q=80" },
    { name: "Çilek Frozen", price: "200 TL", category: "Frozen", img: "https://images.unsplash.com/photo-1464965911861-746a04b4bca6?w=500&q=80" },
    { name: "Limon Frozen", price: "200 TL", category: "Frozen", img: "https://images.unsplash.com/photo-1560008511-11c63416e52d?w=500&q=80" },

    // Milkshake
    { name: "Çikolata Milkshake", price: "200 TL", category: "Milkshake", img: "https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=500&q=80" },
    { name: "Çilek Milkshake", price: "200 TL", category: "Milkshake", img: "https://images.unsplash.com/photo-1497034825429-c343d7c6a68f?w=500&q=80" },

    // Nargile
    { name: "Love 66 Nargile", price: "300 TL", category: "Nargile", img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&q=80" },
    { name: "Ananas Nargile", price: "300 TL", category: "Nargile", img: "https://images.unsplash.com/photo-1550258987-190a2d41a8ba?w=500&q=80" },

    // Çerez
    { name: "Karışık Çerez", price: "300 TL", category: "Çerez", img: "https://images.unsplash.com/photo-1599599810769-bcde5a160d32?w=500&q=80" },
    { name: "Antep Fıstığı", price: "400 TL", category: "Çerez", img: "https://images.unsplash.com/photo-1563729784474-d77dbb933a9e?w=500&q=80" },

    // Filtre Çay
    { name: "Kış Çayı", price: "150 TL", category: "Filtre Çay", img: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=500&q=80" },
    { name: "Yeşil Çay", price: "150 TL", category: "Filtre Çay", img: "https://images.unsplash.com/photo-1627435601361-ec25f5b1d0e5?w=500&q=80" },

    // Dondurma
    { name: "Vanilyalı Dondurma", price: "200 TL", category: "Dondurma", img: "https://images.unsplash.com/photo-1570197788417-0e82375c9371?w=500&q=80" },
    { name: "Çikolatalı Dondurma", price: "200 TL", category: "Dondurma", img: "https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=500&q=80" }
  ];

  const TARGET_PASS = "1171";
  let currentCategory = 'Tümü';
  let isAdminMode = false;

  function toggleLoginBox() {
    if (isAdminMode) {
      isAdminMode = false;
      document.getElementById('bodyTag').classList.remove('admin-mode');
      document.getElementById('lockIcon').className = "fa-solid fa-lock";
      alert("Yönetici modu kapatıldı.");
      renderProducts();
      return;
    }
    document.getElementById('loginBox').classList.toggle('open');
  }

  function checkPassword() {
    const input = document.getElementById('passInput').value;
    const errDiv = document.getElementById('loginError');

    if (input === TARGET_PASS) {
      isAdminMode = true;
      document.getElementById('bodyTag').classList.add('admin-mode');
      document.getElementById('loginBox').classList.remove('open');
      document.getElementById('lockIcon').className = "fa-solid fa-lock-open";
      errDiv.style.display = 'none';
      document.getElementById('passInput').value = '';
      renderCategories();
      renderProducts();
    } else {
      errDiv.style.display = 'block';
      errDiv.innerText = "Hatalı şifre!";
    }
  }

  // --- KATEGORİ İŞLEMLERİ (KALEMLE İSİM VE GÖRSEL DEĞİŞTİRME) ---
  function editCurrentCategory() {
    if (currentCategory === 'Tümü') return alert("Tümü kategorisi düzenlenemez.");
    const catObj = categoriesData.find(c => c.name === currentCategory);
    if (!catObj) return;

    const newName = prompt("Yeni Kategori Adı:", catObj.name);
    if (!newName) return;

    // Ürünlerdeki kategori isimlerini de güncelle
    allProducts.forEach(p => {
      if (p.category === catObj.name) p.category = newName;
    });

    catObj.name = newName;
    currentCategory = newName;
    renderCategories();
    renderProducts();
  }

  function changeCategoryBgImg() {
    if (currentCategory === 'Tümü') return;
    const catObj = categoriesData.find(c => c.name === currentCategory);
    if (!catObj) return;

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.onchange = e => {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = function(event) {
        catObj.img = event.target.result;
        renderCategories();
      };
      reader.readAsDataURL(file);
    };
    fileInput.click();
  }

  // --- ÜRÜN İÇİNDEYKEN HIZLI EKLEME ---
  function quickAddProductToCurrentCategory() {
    if (currentCategory === 'Tümü') return alert("Lütfen önce sol üstten bir kategori seçin!");
    const name = document.getElementById('qAddName').value.trim();
    const price = document.getElementById('qAddPrice').value.trim();
    const fileInput = document.getElementById('qAddFile');

    if (!name || !price) return alert("Ürün adı ve fiyatı zorunludur!");

    if (fileInput.files.length > 0) {
      const reader = new FileReader();
      reader.onload = function(e) {
        saveNewProduct(name, price, currentCategory, e.target.result);
      };
      reader.readAsDataURL(fileInput.files[0]);
    } else {
      saveNewProduct(name, price, currentCategory, "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&q=80");
    }
  }

  function saveNewProduct(name, price, category, img) {
    allProducts.unshift({ name, price, category, img });
    document.getElementById('qAddName').value = '';
    document.getElementById('qAddPrice').value = '';
    document.getElementById('qAddFile').value = '';
    renderProducts();
    alert("Ürün eklendi!");
  }

  // --- ÜRÜN DÜZENLEME VE SİLME ---
  function updateProductName(index, globalIdx) {
    const currentName = allProducts[globalIdx].name;
    const newName = prompt("Ürün Adını Düzenle:", currentName);
    if (newName !== null && newName.trim() !== "") {
      allProducts[globalIdx].name = newName.trim();
      renderProducts();
    }
  }

  function updateProductPrice(index, globalIdx) {
    const currentPrice = allProducts[globalIdx].price;
    const newPrice = prompt("Fiyatı Düzenle (Örn: 250 TL):", currentPrice);
    if (newPrice !== null && newPrice.trim() !== "") {
      allProducts[globalIdx].price = newPrice.trim();
      renderProducts();
    }
  }

  function updateProductImage(globalIdx) {
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.onchange = e => {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = function(event) {
        allProducts[globalIdx].img = event.target.result;
        renderProducts();
      };
      reader.readAsDataURL(file);
    };
    fileInput.click();
  }

  function deleteProduct(globalIdx) {
    if (confirm("Bu ürünü silmek istediğinize emin misiniz?")) {
      allProducts.splice(globalIdx, 1);
      renderProducts();
    }
  }

  // --- EKRANA BASTIRMA VE ANİMASYONLAR ---
  function renderCategories() {
    const bar = document.getElementById('categoriesBar');
    bar.innerHTML = `<button class="cat-btn ${currentCategory === 'Tümü' ? 'active' : ''}" style="background-image:url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500&q=80')" onclick="filterCat('Tümü')"><span>Tümü</span></button>`;

    categoriesData.forEach(cat => {
      bar.innerHTML += `
        <button class="cat-btn ${currentCategory === cat.name ? 'active' : ''}" style="background-image:url('${cat.img}')" onclick="filterCat('${cat.name}')">
          <span>${cat.name}</span>
        </button>
      `;
    });

    // Aktif Kategori Başlığı ve Kalem Simgesi
    const titleEl = document.getElementById('activeCategoryTitle');
    const editArea = document.getElementById('categoryEditArea');
    const quickAddSec = document.getElementById('quickAddSection');

    titleEl.innerText = currentCategory;
    
    if (isAdminMode && currentCategory !== 'Tümü') {
      editArea.innerHTML = `
        <button class="btn btn-gold" style="padding:5px 10px; font-size:0.8rem;" onclick="editCurrentCategory()" title="Kategori Adını Değiştir"><i class="fa-solid fa-pen"></i> Adı Değiştir</button>
        <button class="btn btn-gold" style="padding:5px 10px; font-size:0.8rem; margin-left:5px;" onclick="changeCategoryBgImg()" title="Kategori Görselini Değiştir"><i class="fa-solid fa-image"></i> Görseli Değiştir</button>
      `;
      quickAddSec.style.display = 'block';
      document.getElementById('quickAddTitle').innerText = `+ "${currentCategory}" Kategorisine Ürün Ekle`;
    } else {
      editArea.innerHTML = '';
      quickAddSec.style.display = 'none';
    }
  }

  function filterCat(catName) {
    currentCategory = catName;
    renderCategories();
    renderProducts();
  }

  function renderProducts() {
    const grid = document.getElementById('menuGrid');
    grid.innerHTML = '';

    const filtered = currentCategory === 'Tümü' 
      ? allProducts 
      : allProducts.map((item, idx) => ({ ...item, originalIndex: idx })).filter(p => p.category === currentCategory);

    filtered.forEach((item, index) => {
      const gIdx = item.originalIndex !== undefined ? item.originalIndex : allProducts.indexOf(item);
      // Her ürüne farklı animasyon sınıfları atıyoruz (anim-1, anim-2, anim-3, anim-4)
      const animClass = `anim-${(index % 4) + 1}`;

      grid.innerHTML += `
        <div class="menu-item ${animClass}">
          <div class="admin-controls">
            <div class="admin-btn-icon" onclick="updateProductImage(${gIdx})" title="Fotoğrafı Değiştir"><i class="fa-solid fa-camera"></i></div>
            <div class="admin-btn-icon delete" onclick="deleteProduct(${gIdx})" title="Ürünü Sil"><i class="fa-solid fa-trash"></i></div>
          </div>

          <div class="item-img-wrapper">
            <img src="${item.img}" class="item-img" alt="${item.name}">
            <div class="item-badge" onclick="${isAdminMode ? `updateProductPrice(${index}, ${gIdx})` : ''}" style="${isAdminMode ? 'cursor:pointer; border:1px dashed #fff;' : ''}" title="Fiyatı Değiştir">${item.price}</div>
          </div>
          <div class="item-content">
            <div class="item-title" onclick="${isAdminMode ? `updateProductName(${index}, ${gIdx})` : ''}" style="${isAdminMode ? 'cursor:pointer; text-decoration:underline dashed var(--gold);' : ''}" title="İsmi Değiştir">${item.name}</div>
          </div>
        </div>
      `;
    });
  }

  window.addEventListener('load', () => {
    renderCategories();
    renderProducts();
  });
</script>

</body>
</html>
