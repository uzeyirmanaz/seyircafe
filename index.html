<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SEYİR CAFE — Adisyon Sistemi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root{
    --bg:#F1F3F5;
    --surface:#FFFFFF;
    --ink:#1B2530;
    --ink-soft:#69737E;
    --ink-faint:#9AA3AC;
    --line:#E4E7EC;
    --navy:#152431;
    --navy-soft:#233544;
    --brand:#0E8F5C;
    --brand-deep:#0B7249;
    --brand-soft:#E4F6ED;
    --warn:#E58A00;
    --warn-soft:#FDF0DA;
    --danger:#DC3D43;
    --danger-soft:#FBE3E4;
    --blue:#2F6FED;
    --blue-soft:#E7EEFE;
    --logo-red:#E11D2E;
    --radius:12px;
    --shadow:0 2px 10px rgba(21,36,49,.06);
    --shadow-lg:0 16px 40px rgba(21,36,49,.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    font-size:14.5px;
  }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  input,select{ font-family:inherit; }
  a{ color:inherit; text-decoration:none; }
  #app{ min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- App chrome ---------- */
  .appbar{
    background:var(--navy); color:#fff; padding:12px 18px;
    display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50;
  }
  .appbar .brand{ display:flex; align-items:center; gap:10px; }
  .appbar .brand .mark{
    width:32px;height:32px;border-radius:8px; background:var(--brand);
    display:flex;align-items:center;justify-content:center; font-weight:800; font-size:15px;
  }
  .appbar .brand .txt{ font-weight:700; font-size:15.5px; letter-spacing:.2px; }
  .appbar .brand .mark, .login-card .mark{ background:var(--logo-red); color:#fff; }
  .brand-logo{ color:var(--logo-red); font-weight:800; }
  .idot{ position:relative; display:inline-block; }
  .idot .heart{
    position:absolute; left:50%; top:-8px; transform:translateX(-50%); font-size:8px; line-height:1;
    animation: idot-heartbeat 2.6s ease-in-out infinite;
  }
  @keyframes idot-heartbeat{
    0%,100%{ opacity:.28; transform:translateX(-50%) scale(.78); }
    50%{ opacity:1; transform:translateX(-50%) scale(1.15); }
  }
  .appbar .staff{ display:flex; align-items:center; gap:10px; }
  .appbar .staff .who{ text-align:right; }
  .appbar .staff .nm{ font-size:13px; font-weight:700; }
  .appbar .staff .rl{ font-size:11px; color:#9FB3BE; }
  .appbar .staff .avatar{
    width:30px;height:30px;border-radius:50%; background:var(--navy-soft); border:1px solid #34495a;
    display:flex;align-items:center;justify-content:center; font-size:12px; font-weight:700;
  }
  .appbar .logout{ font-size:12px; color:#C9D3DA; border:1px solid #34495a; padding:6px 10px; border-radius:8px; }

  .tabstrip{
    background:var(--surface); border-bottom:1px solid var(--line); display:flex; gap:4px;
    padding:0 12px; overflow-x:auto; position:sticky; top:53px; z-index:49;
  }
  .tabstrip a{
    padding:12px 14px; font-size:13.5px; font-weight:600; color:var(--ink-soft); white-space:nowrap;
    border-bottom:3px solid transparent;
  }
  .tabstrip a.active{ color:var(--brand-deep); border-bottom-color:var(--brand); }

  .content{ flex:1; padding:18px 16px 90px; max-width:1200px; width:100%; margin:0 auto; }

  h1,h2,h3{ margin:0 0 4px; }
  .page-title{ font-size:19px; font-weight:800; margin-bottom:2px; }
  .page-sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:16px; }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:11px 16px; border-radius:9px; font-weight:700; font-size:14px;
    background:var(--brand); color:#fff;
  }
  .btn.blue{ background:var(--blue); }
  .btn.danger{ background:var(--danger); }
  .btn.ghost{ background:var(--surface); color:var(--ink); border:1px solid var(--line); }
  .btn.sm{ padding:7px 12px; font-size:13px; border-radius:7px; }
  .btn:disabled{ opacity:.38; cursor:not-allowed; }
  .btn.block{ width:100%; }

  /* ---------- Login ---------- */
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--navy); padding:20px; }
  .login-card{ background:var(--surface); border-radius:18px; padding:32px 26px; width:100%; max-width:360px; box-shadow:var(--shadow-lg); text-align:center; }
  .login-card .mark{ width:52px;height:52px;border-radius:14px; background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px; margin:0 auto 14px; }
  .login-card h2{ font-size:19px; margin-bottom:2px; }
  .login-card p{ color:var(--ink-soft); font-size:13px; margin:0 0 20px; }
  .pin-dots{ display:flex; gap:12px; justify-content:center; margin-bottom:20px; }
  .pin-dots .dot{ width:14px;height:14px;border-radius:50%; border:2px solid var(--line); }
  .pin-dots .dot.filled{ background:var(--brand); border-color:var(--brand); }
  .pinpad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .pinpad button{ background:var(--bg); border-radius:12px; padding:16px 0; font-size:19px; font-weight:700; }
  .pinpad button:active{ background:var(--brand-soft); }
  .pinpad .wide{ font-size:13px; font-weight:700; color:var(--ink-soft); }
  .login-error{ color:var(--danger); font-size:12.5px; margin-bottom:10px; min-height:16px; font-weight:600; }
  .staff-quickpick{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:18px; }
  .staff-quickpick button{ background:var(--bg); border-radius:20px; padding:7px 14px; font-size:12.5px; font-weight:600; color:var(--ink-soft); }
  .staff-quickpick button.sel{ background:var(--navy); color:#fff; }

  /* ---------- Tables grid ---------- */
  .tables-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
  .legend{ display:flex; gap:14px; font-size:12px; color:var(--ink-soft); flex-wrap:wrap; }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:10px;height:10px;border-radius:3px; display:inline-block; }

  .tables-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:12px; }
  .table-card{
    background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius); padding:16px 14px;
    text-align:left; box-shadow:var(--shadow); position:relative; min-height:96px;
  }
  .table-card h4{ font-size:16px; margin:0 0 4px; }
  .table-card .status-txt{ font-size:11.5px; color:var(--ink-soft); font-weight:600; }
  .table-card .amt{ font-weight:800; margin-top:8px; font-size:15px; }
  .table-card .waiter{ font-size:11px; color:var(--ink-faint); margin-top:2px; }
  .table-card.dolu{ border-color:var(--brand); background:var(--brand-soft); }
  .table-card.dolu .amt{ color:var(--brand-deep); }
  .table-card.bekliyor{ border-color:var(--danger); animation:table-pulse .9s ease-in-out infinite; }
  .table-card.bekliyor .amt{ color:var(--danger); }
  .table-card.bekliyor .status-txt{ color:var(--danger); font-weight:800; }
  @keyframes table-pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(220,61,67,.5); background:var(--danger-soft); }
    50%{ box-shadow:0 0 0 10px rgba(220,61,67,0); background:#ffc4c7; }
  }
  .table-card .dot-indicator{ position:absolute; top:12px; right:12px; width:9px;height:9px;border-radius:50%; background:var(--ink-faint); }
  .table-card.dolu .dot-indicator{ background:var(--brand); }
  .table-card.bekliyor .dot-indicator{ background:var(--danger); }
  .table-card.hazirlaniyor{ border-color:var(--danger); background:var(--brand-soft); }
  .table-card.hazirlaniyor .amt{ color:var(--brand-deep); }
  .table-card.hazirlaniyor .dot-indicator{ background:var(--danger); }
  .table-card.hazirbildirim{ border-color:var(--brand); animation:table-ready-blink 1s ease-in-out infinite; }
  .table-card.hazirbildirim .amt{ color:var(--brand-deep); }
  .table-card.hazirbildirim .dot-indicator{ background:var(--brand); }
  @keyframes table-ready-blink{
    0%,100%{ background:var(--brand-soft); box-shadow:0 0 0 0 rgba(14,143,92,.5); }
    50%{ background:#7EE3B4; box-shadow:0 0 0 10px rgba(14,143,92,0); }
  }
  .custom-label{ font-size:11px; color:var(--blue); font-weight:700; margin-top:2px; }

  /* ---------- Order entry screen ---------- */
  .order-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
  .order-header .back{ font-size:13px; font-weight:700; color:var(--ink-soft); display:inline-flex; align-items:center; gap:4px; }

  .cat-tabs{ display:flex; gap:8px; overflow-x:auto; padding:2px 0 14px; -webkit-overflow-scrolling:touch; }
  .cat-tabs button{
    flex:0 0 auto; background:var(--surface); border:1px solid var(--line); border-radius:20px;
    padding:8px 15px; font-size:13px; font-weight:700; color:var(--ink-soft);
  }
  .cat-tabs button.active{ background:var(--navy); color:#fff; border-color:var(--navy); }

  .item-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin-bottom:20px; }
  .item-tile{
    background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:12px 12px; text-align:left;
    position:relative; min-height:76px; display:flex; flex-direction:column; justify-content:space-between;
  }
  .item-tile:active{ background:var(--brand-soft); }
  .item-tile .nm{ font-weight:700; font-size:13.5px; line-height:1.3; }
  .item-tile .pr{ font-size:12.5px; color:var(--ink-soft); margin-top:6px; font-weight:600; }
  .item-tile .tile-photo{ width:100%; height:72px; border-radius:8px; background-size:cover; background-position:center; background-color:var(--bg); margin-bottom:8px; }
  .item-tile .stock-tag{ font-size:10px; font-weight:700; color:var(--ink-faint); margin-top:3px; }
  .item-tile .stock-tag.low{ color:var(--danger); }
  .item-tile .badge-qty{
    position:absolute; top:-7px; right:-7px; background:var(--brand); color:#fff; font-size:12px; font-weight:800;
    width:22px;height:22px;border-radius:50%; display:flex; align-items:center; justify-content:center;
  }
  .item-tile.sold-out{ opacity:.42; }
  .item-tile.sold-out::after{ content:'Tükendi'; position:absolute; bottom:10px; right:10px; font-size:10.5px; color:var(--danger); font-weight:800; }

  .section-label{ font-size:12.5px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; margin:18px 0 8px; }

  .adisyon-list{ background:var(--surface); border:1px solid var(--line); border-radius:11px; overflow:hidden; margin-bottom:14px; }
  .adisyon-row{ display:flex; justify-content:space-between; align-items:center; padding:11px 14px; border-bottom:1px solid var(--line); gap:8px; }
  .adisyon-row:last-child{ border-bottom:none; }
  .adisyon-row .nm{ font-weight:600; font-size:13.5px; }
  .adisyon-row .meta{ font-size:11px; color:var(--ink-faint); }
  .status-pill{ font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .status-yeni{ background:var(--blue-soft); color:var(--blue); }
  .status-hazirlaniyor{ background:var(--warn-soft); color:var(--warn); }
  .status-hazir{ background:var(--brand-soft); color:var(--brand-deep); }
  .status-servis{ background:#EDEFF2; color:var(--ink-soft); }

  .cart-dock{
    position:fixed; left:0; right:0; bottom:0; background:var(--navy); color:#fff;
    padding:13px 18px; display:flex; align-items:center; justify-content:space-between; z-index:60;
    box-shadow:0 -8px 24px rgba(0,0,0,.25);
  }
  .cart-dock .total{ font-size:18px; font-weight:800; }
  .cart-dock .sub{ font-size:11px; color:#9FB3BE; }

  .grand-total-bar{
    display:flex; justify-content:space-between; align-items:center; background:var(--navy); color:#fff;
    border-radius:11px; padding:14px 16px; margin:16px 0; font-weight:800; font-size:16px;
  }

  /* ---------- Modals ---------- */
  .modal-bg{ position:fixed; inset:0; background:rgba(21,36,49,.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; }
  .modal{ background:var(--surface); width:100%; max-width:400px; border-radius:16px; padding:22px 20px; max-height:88vh; overflow-y:auto; }
  .modal h3{ margin-bottom:4px; }
  .modal .close-x{ float:right; font-size:18px; color:var(--ink-soft); cursor:pointer; }

  /* ---------- Kitchen ---------- */
  .kitchen-cols{ display:grid; grid-template-columns:1fr; gap:14px; }
  @media(min-width:820px){ .kitchen-cols{ grid-template-columns:1fr 1fr 1fr; } }
  .kcol .kcol-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .kcol .kcol-head .count{ background:var(--navy); color:#fff; font-size:11px; font-weight:800; padding:2px 8px; border-radius:12px; }
  .ticket{ background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--blue); border-radius:10px; padding:13px 15px; margin-bottom:11px; box-shadow:var(--shadow); }
  .ticket.warn{ border-left-color:var(--warn); }
  .ticket.ready{ border-left-color:var(--brand); }
  .ticket.urgent{ border-left-color:var(--danger); animation:seyir-ticket-blink .9s ease-in-out infinite; }
  @keyframes seyir-ticket-blink{ 0%,100%{ background:#fff; box-shadow:0 0 0 0 rgba(220,61,67,.5); } 50%{ background:var(--danger-soft); box-shadow:0 0 0 8px rgba(220,61,67,0); } }
  .ticket .head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .ticket .head .tname{ font-weight:800; font-size:15px; }
  .ticket .head .time{ font-size:11.5px; color:var(--ink-faint); font-weight:700; }
  .ticket .waiter{ font-size:11px; color:var(--ink-faint); margin-bottom:6px; }
  .ticket ul{ margin:0 0 10px; padding-left:16px; font-size:13.5px; line-height:1.6; }

  /* ---------- Reports / Admin ---------- */
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px; }
  .stat-card{ background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:15px; }
  .stat-card .num{ font-size:22px; font-weight:800; }
  .stat-card .lbl{ font-size:12px; color:var(--ink-soft); margin-top:2px; }

  .table-list{ background:var(--surface); border:1px solid var(--line); border-radius:11px; overflow:hidden; }
  .table-list .r{ display:flex; justify-content:space-between; padding:11px 14px; border-bottom:1px solid var(--line); font-size:13.5px; align-items:center; gap:8px; flex-wrap:wrap; }
  .table-list .r:last-child{ border-bottom:none; }

  .admin-tabs{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .admin-tabs button{ background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:8px 15px; font-size:13px; font-weight:700; color:var(--ink-soft); }
  .admin-tabs button.active{ background:var(--navy); color:#fff; border-color:var(--navy); }

  .form-inline{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; align-items:center; }
  .form-inline input, .form-inline select{ padding:9px 10px; border-radius:8px; border:1px solid var(--line); font-size:13.5px; }

  .item-row{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; flex-wrap:wrap; }
  .item-row .nm{ font-weight:700; flex:1; min-width:110px; font-size:13.5px; }
  .item-row .pr{ width:76px; padding:6px 8px; border-radius:6px; border:1px solid var(--line); }
  .item-thumb{ width:36px;height:36px;border-radius:6px;object-fit:cover;border:1px solid var(--line); flex:0 0 auto; }
  .toggle{ display:flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-soft); white-space:nowrap; }

  .zone-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:6px 12px; font-size:12.5px; font-weight:700; color:var(--ink); }
  .zone-chip button{ color:var(--ink-faint); font-weight:800; font-size:14px; }

  .empty-note{ text-align:center; padding:36px 20px; color:var(--ink-faint); font-size:13.5px; }
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:12px 20px; border-radius:30px; font-size:13.5px; box-shadow:var(--shadow-lg); z-index:200; font-weight:600; }

  .public-menu{ max-width:640px; margin:0 auto; }
  .public-cat h3{ font-size:15px; margin:22px 0 10px; }
  .public-item{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); }
  .public-item .nm{ font-weight:700; font-size:14.5px; }
  .public-item .ds{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .public-item .pr{ font-weight:700; color:var(--brand-deep); white-space:nowrap; }

  /* ---------- Icon row (wifi / instagram / tiktok / maps) ---------- */
  .icon-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:4px 0 22px; }
  .icon-btn{ display:flex; flex-direction:column; align-items:center; gap:5px; background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:11px 16px; font-size:11px; font-weight:700; color:var(--ink-soft); min-width:66px; box-shadow:var(--shadow); }
  .icon-btn:active{ background:var(--bg); }
  .icon-btn svg{ width:22px; height:22px; }
  .icon-btn.wifi svg{ color:var(--blue); }
  .icon-btn.ig svg{ color:#C22A6E; }
  .icon-btn.tt svg{ color:#1B2530; }
  .icon-btn.maps svg{ color:var(--danger); }

  /* ---------- Emergency pending-order alerts ---------- */
  #alert-overlay{ position:fixed; inset:0; z-index:40; pointer-events:none; display:none; background:rgba(220,61,67,.55); }
  body.pending-alert #alert-overlay{ display:block; animation: seyir-emergency-flash .6s linear infinite; }
  @keyframes seyir-emergency-flash{ 0%,100%{ opacity:1; } 50%{ opacity:0; } }
  .alert-banner{
    background:var(--danger); color:#fff; text-align:center; font-weight:800; font-size:13px;
    padding:11px 14px; letter-spacing:.02em; position:sticky; top:0; z-index:55; cursor:pointer;
    animation: seyir-emergency-banner .9s ease-in-out infinite;
  }
  @keyframes seyir-emergency-banner{ 0%,100%{ background:var(--danger); } 50%{ background:#8f1218; } }
  .notif-btn{ font-size:16px; padding:6px 9px; border:1px solid #34495a; border-radius:8px; margin-right:6px; }

  /* ---------- Approve-order / move-qty modal helpers ---------- */
  .qty-stepper{ display:flex; align-items:center; gap:10px; }
  .qty-stepper b{ min-width:22px; text-align:center; font-size:15px; }

  /* ---------- Report: month picker grid ---------- */
  .month-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .month-grid button{
    display:flex; flex-direction:column; align-items:center; gap:4px; background:var(--surface);
    border:1px solid var(--line); border-radius:10px; padding:12px 6px; font-size:12.5px;
  }
  .month-grid button:active{ background:var(--brand-soft); }
  .month-grid button .mn{ font-weight:800; font-size:13px; }
  .month-grid button .mv{ font-size:11px; color:var(--ink-soft); }
  .year-switch{ display:flex; align-items:center; justify-content:center; gap:18px; margin:6px 0 16px; }
  .year-switch b{ font-size:17px; }

  /* ---------- Accordion (Aktif Masalar / Canlı Stok Durumu) ---------- */
  .accordion-head{ display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .accordion-head .chev{ font-size:11px; color:var(--ink-faint); transition:transform .2s ease; }
  .accordion-head.open .chev{ transform:rotate(180deg); }
  .accordion-panel{ max-height:0; overflow:hidden; transition:max-height .28s ease; }
  .accordion-panel.open{ max-height:3000px; }

  /* ---------- Stations (İstasyonlar) ---------- */
  .station-card{ background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:14px; margin-bottom:12px; }
  .station-card.inactive{ opacity:.55; }
  .station-card .row1{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .station-cat-chip{ display:inline-flex; align-items:center; background:var(--bg); border:1px solid var(--line); border-radius:20px; padding:6px 12px; font-size:12.5px; font-weight:600; margin:3px 4px 3px 0; }
  .station-cat-chip.assigned{ background:var(--navy); color:#fff; border-color:var(--navy); }

  /* ---------- Inline admin edit on order screen ---------- */
  .item-tile.edit-mode{ text-align:left; }
  .item-tile.edit-mode input{ width:100%; padding:5px 6px; border-radius:6px; border:1px solid var(--line); font-size:12px; margin-bottom:4px; }
  .item-tile.edit-mode select{ width:100%; padding:5px 6px; border-radius:6px; border:1px solid var(--line); font-size:11.5px; margin-bottom:4px; }

const HAS_CLOUD_STORAGE = (typeof window!=='undefined' && window.storage && typeof window.storage.get==='function' && typeof window.storage.set==='function');
async function sGet(key, fallback){
  try{
    if(HAS_CLOUD_STORAGE){
      const res = await window.storage.get(key, true);
      if(!res) return fallback;
      return JSON.parse(res.value);
    }
    if(FIREBASE_READY){
      const snap = await FIREBASE_DB.collection('seyir_data').doc(key).get();
      if(!snap.exists) return fallback;
      return JSON.parse(snap.data().v);
    }
    const raw = localStorage.getItem(key);
    if(raw===null || raw===undefined) return fallback;
    return JSON.parse(raw);
  }catch(e){ return fallback; }
}
async function sSet(key, value){
  try{
    if(HAS_CLOUD_STORAGE){
      await window.storage.set(key, JSON.stringify(value), true);
      return;
    }
    if(FIREBASE_READY){
      await FIREBASE_DB.collection('seyir_data').doc(key).set({ v: JSON.stringify(value) });
      return;
    }
    localStorage.setItem(key, JSON.stringify(value));
  }catch(e){ console.error('storage set failed', key, e); }
}

// ---------- photo upload (compressed client-side) ----------
function compressImageFile(file, maxDim, quality){
  maxDim = maxDim || 420; quality = quality || 0.68;
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let width = img.width, height = img.height;
        if(width>height){ if(width>maxDim){ height = Math.round(height*maxDim/width); width = maxDim; } }
        else{ if(height>maxDim){ width = Math.round(width*maxDim/height); height = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handlePhotoUpload(catId, itemId, inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  try{

  'seyir:menu':'menu', 'seyir:tables':'tables', 'seyir:orders':'orders', 'seyir:bills':'bills',
  'seyir:assign':'assign', 'seyir:staff':'staff', 'seyir:zones':'zones', 'seyir:cari':'cari', 'seyir:settings':'settings',
  'seyir:stations':'stations', 'seyir:catStation':'catStation', 'seyir:expenses':'expenses',
  'seyir:readyAlerts':'readyAlerts', 'seyir:tableCustomLabels':'tableCustomLabels', 'seyir:kasa':'kasa',
};
function setupRealtimeSync(){
  if(!FIREBASE_READY) return;
  Object.keys(SYNC_KEY_TO_FIELD).forEach(key=>{
    FIREBASE_DB.collection('seyir_data').doc(key).onSnapshot(snap=>{
      if(!snap.exists || !snap.data()) return;
      try{
        const val = JSON.parse(snap.data().v);
        STATE[SYNC_KEY_TO_FIELD[key]] = val;
        LAST_STATE_SNAPSHOT = snapshotState();
        if(STATE.loaded && !isTypingInApp()) render();
      }catch(e){ console.error('senkronizasyon hatası', key, e); }
    }, err => console.error('Firestore dinleyici hatası', key, err));
  });
}

// ---------- odak (focus) koruma: arka planda gelen veri yenilemeleri klavyeyi kapatmasın ----------
function isTypingInApp(){
  const ae = document.activeElement;
  if(!ae) return false;
  const tag = ae.tagName;
  if(tag!=='INPUT' && tag!=='TEXTAREA') return false;
  const type = (ae.type||'text').toLowerCase();
  if(['button','checkbox','radio','range','submit','file','date'].includes(type)) return false;
  const app = document.getElementById('app');
  return !!(app && app.contains(ae));
}
// Herhangi bir input/textarea odağını kaybettiğinde (kullanıcı yazmayı bitirdiğinde)
// kısa bir gecikmeyle ekranı güncel veriyle tazele.
document.addEventListener('focusout', function(e){
  const t = e.target;
  if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA')){
    setTimeout(render, 80);
  }
}, true);

function snapshotState(){
  return JSON.stringify({menu:STATE.menu,tables:STATE.tables,zones:STATE.zones,orders:STATE.orders,bills:STATE.bills,assign:STATE.assign,staff:STATE.staff,cari:STATE.cari,settings:STATE.settings,
    stations:STATE.stations, catStation:STATE.catStation, expenses:STATE.expenses, readyAlerts:STATE.readyAlerts, tableCustomLabels:STATE.tableCustomLabels, kasa:STATE.kasa});
}
let LAST_STATE_SNAPSHOT = null;

async function boot(){
  await loadState();
  LAST_STATE_SNAPSHOT = snapshotState();
  render();
  if(FIREBASE_READY){
    setupRealtimeSync();       // Firebase varsa: anlık, sunucu-push tabanlı senkronizasyon
  }else{
    // Firebase yoksa: 2 sn'de bir yoklama. Veri gerçekten değişmediyse veya kullanıcı
    // o an bir kutuya yazıyorsa ekranı YENİDEN ÇİZMİYORUZ — aksi halde her 2 saniyede
    // bir input'lar odağını kaybedip mobilde klavye kapanıyordu.
    setInterval(async ()=>{
      await loadState();
      const snap = snapshotState();
      if(snap===LAST_STATE_SNAPSHOT) return;
      LAST_STATE_SNAPSHOT = snap;
      if(isTypingInApp()) return; // yazma bitince focusout dinleyicisi zaten tazeleyecek
      render();
    }, 2000);
  }
}
boot();

const PUBLIC_ROUTES = ['/login','/menu','/musteri'];

let LAST_RENDER_PATH = null;
function render(){
  if(!STATE.loaded) return;
  const {path, params} = parseHash();
  const app = document.getElementById('app');
  const session = getSession();

  if(!PUBLIC_ROUTES.includes(path) && !session){ location.hash = '/login'; return; }
  if(session){
    const navAllowed = ['/masalar','/mutfak','/rapor','/admin','/cari'];
    if(navAllowed.includes(path)){
      const item = NAV_ITEMS.find(n=>n.path===path);
      if(item && !item.roles.includes(session.role)){ location.hash = ROLE_HOME[session.role]||'/masalar'; return; }
    }
  }

  let html = '';
  if(path === '/login') html = renderLogin();
  else if(path === '/menu') html = renderPublicMenu();
  else if(path === '/musteri') html = renderMusteriSiparis(params);
  else if(path === '/masalar') html = shell(session,'/masalar', renderMasalar());
  else if(path === '/masa') html = shell(session,'/masalar', renderOrderEntry(params));
  else if(path === '/istasyon-sec') html = renderIstasyonSec();
  else if(path === '/mutfak') html = shell(session,'/mutfak', renderMutfak());
  else if(path === '/rapor') html = shell(session,'/rapor', renderRapor());
  else if(path === '/admin') html = shell(session,'/admin', renderAdmin());
  else if(path === '/cari') html = shell(session,'/cari', renderGiderler());
  else { location.hash = session ? (ROLE_HOME[session.role]||'/masalar') : '/login'; return; }

  // Sadece sayfa GERÇEKTEN değiştiyse (yeni bir menüye tıklandıysa) en üste
  // kaydır. Arka planda gelen canlı veri güncellemeleri (Firestore'dan) veya
  // kendi işlemleriniz (rol değiştirme, sipariş ilerletme vb.) sayfayı
  // yeniden çizer ama kaydırma konumunuzu koruruz — artık "acele tıklama"
  // sorunu yaşanmaz.
  const isNavigation = (LAST_RENDER_PATH !== path);
  const prevScrollY = window.scrollY;

  // Odak koruma: yeniden çizmeden önce hangi input'ta olduğumuzu ve imleç
  // konumunu hatırla, çizimden sonra aynı input'a (varsa) odağı geri ver.
  const ae = document.activeElement;
  let focusInfo = null;
  if(ae && ae.id && app.contains(ae) && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT')){
    focusInfo = { id: ae.id, selStart: (typeof ae.selectionStart==='number'?ae.selectionStart:null), selEnd: (typeof ae.selectionEnd==='number'?ae.selectionEnd:null) };
  }

  app.innerHTML = html + renderModalOverlay();
  if(isNavigation){ window.scrollTo(0,0); }
  else{ window.scrollTo(0, prevScrollY); }
  LAST_RENDER_PATH = path;

  if(focusInfo){
    const el = document.getElementById(focusInfo.id);
    if(el){
      el.focus();
      if(focusInfo.selStart!=null && typeof el.setSelectionRange==='function'){
        try{ el.setSelectionRange(focusInfo.selStart, focusInfo.selEnd); }catch(e){}
      }
    }
  }
}

// ---------- pending-order emergency alert system (sound + notification + red flash) ----------
let ALERT_TIMER = null;
let ALERT_LAST_COUNT = 0;
let ALERT_AUDIO_CTX = null;
function updateAlertState(pendingCount){
  document.body.classList.toggle('pending-alert', pendingCount>0);
  if(pendingCount>0){
    if(pendingCount>ALERT_LAST_COUNT){ notifyNewOrder(pendingCount); playAlertBeep(); }
    if(!ALERT_TIMER){ ALERT_TIMER = setInterval(playAlertBeep, 4000); }
  }else if(ALERT_TIMER){
    clearInterval(ALERT_TIMER); ALERT_TIMER = null;
  }
  ALERT_LAST_COUNT = pendingCount;
}
function clearAlertState(){
  document.body.classList.remove('pending-alert');
  if(ALERT_TIMER){ clearInterval(ALERT_TIMER); ALERT_TIMER = null; }
  ALERT_LAST_COUNT = 0;
}
function warmupAudio(){
  try{
    ALERT_AUDIO_CTX = ALERT_AUDIO_CTX || new (window.AudioContext||window.webkitAudioContext)();
    if(ALERT_AUDIO_CTX.state==='suspended') ALERT_AUDIO_CTX.resume();
  }catch(e){}
}
function beepTone(ctx, freq, delay){
  setTimeout(()=>{
    try{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.35);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime+0.4);
    }catch(e){}
  }, delay);
}
function playAlertBeep(){
  try{
    warmupAudio();
    const ctx = ALERT_AUDIO_CTX; if(!ctx) return;
    beepTone(ctx, 880, 0);
    beepTone(ctx, 1040, 220);
  }catch(e){}
}
function notifyNewOrder(count){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  try{ new Notification('🔴 Yeni sipariş onay bekliyor', { body: count+' sipariş onayınızı bekliyor', tag:'seyir-order-alert' }); }
  catch(e){}
}
async function requestNotifPermission(){
  if(!('Notification' in window)){ showToast('Bu cihaz bildirimleri desteklemiyor'); return; }
  try{
    const already = Notification.permission;
    const p = await Notification.requestPermission();
    if(already==='default'){ showToast(p==='granted' ? 'Bildirimler etkinleştirildi ✓' : 'Bildirim izni verilmedi'); }
    render();
  }catch(e){}
}

function renderLogin(){
  clearAlertState();
  const dots = [0,1,2,3].map(i=>`<div class="dot ${i<PIN_BUF.length?'filled':''}"></div>`).join('');
  return `<div class="login-wrap"><div class="login-card">

      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pinPress('${n}')">${n}</button>`).join('')}
      <button class="wide" onclick="pinClear()">Temizle</button>
      <button onclick="pinPress('0')">0</button>
      <button class="wide" onclick="pinBack()">⌫</button>
    </div>
  </div></div>`;

function pinPress(d){
  if(PIN_BUF.length>=4) return;
  PIN_BUF += d; LOGIN_ERR='';
  if(PIN_BUF.length===4) tryLogin();
  render();
}
function pinBack(){ PIN_BUF = PIN_BUF.slice(0,-1); render(); }
function pinClear(){ PIN_BUF=''; LOGIN_ERR=''; render(); }
function tryLogin(){
  const staff = STATE.staff.find(s=>s.pin===PIN_BUF);
  // Ortak istasyon şifresi: mutfak/bar/nargile gibi üretim personeli için, tek
  // tek personel hesabı açmaya gerek kalmadan ortak bir şifreyle giriş.
  const isStationPin = !staff && STATE.settings.stationPin && PIN_BUF===STATE.settings.stationPin;
  if(staff || isStationPin){
    if(staff){ setSession({staffId:staff.id, name:staff.name, role:staff.role, stationId:null}); }
    else{ setSession({staffId:null, name:'İstasyon Personeli', role:'mutfak', stationId:null}); }
    PIN_BUF=''; LOGIN_ERR='';
    warmupAudio(); // kullanıcı etkileşimi ile ses altyapısını hazırla (tarayıcı otomatik-oynatma engelini aşmak için)
    if('Notification' in window && Notification.permission==='default'){ requestNotifPermission(); }
    const role = staff ? staff.role : 'mutfak';
    // Mutfak/istasyon rolündeki personel, birden fazla aktif istasyon varsa önce hangi
    // istasyonda çalıştığını seçmelidir; tek aktif istasyon varsa otomatik atanır.
    if(role==='mutfak'){
      const actives = activeStations();
      if(actives.length>1){ location.hash='/istasyon-sec'; return; }
      if(actives.length===1){ const s=getSession(); s.stationId=actives[0].id; setSession(s); }
    }
    location.hash = ROLE_HOME[role]||'/masalar';
  }else{
    LOGIN_ERR = 'Hatalı PIN, tekrar deneyin';
    PIN_BUF='';
    setTimeout(render, 60);
  }
}

async function inlineUpdateName(catId,itemId,val){

  const name = val.trim(); if(!name) return;
  it.name = name; await sSet('seyir:menu',STATE.menu); showToast('Ürün adı güncellendi ✓'); render();
}
async function inlineUpdatePrice(catId,itemId,val){
  const cat=STATE.menu.find(c=>c.id===catId); const it=cat.items.find(i=>i.id===itemId);
  it.price = parseFloat(val)||0; await sSet('seyir:menu',STATE.menu); showToast('Fiyat güncellendi ✓'); render();

async function inlineMoveCategory(fromCatId,itemId,toCatId){
  if(fromCatId===toCatId) return;
  const fromCat=STATE.menu.find(c=>c.id===fromCatId); const toCat=STATE.menu.find(c=>c.id===toCatId);
  if(!fromCat || !toCat) return;
  const idx = fromCat.items.findIndex(i=>i.id===itemId); if(idx<0) return;
  const [it] = fromCat.items.splice(idx,1);
  toCat.items.push(it);
  await sSet('seyir:menu',STATE.menu);
  showToast('Ürün kategorisi güncellendi ✓');
  render();
}
function cartAdd(itemId, delta){
  delta = delta===undefined ? 1 : delta;
  const it = findItem(itemId);
  const cur = CART[itemId]||0;
  let next = Math.max(0, cur+delta);
  // Personel, stokta görünmeyen bir ürünü de sipariş edebilir (örn. mutfakta
  // aslında var ama sisteme işlenmemiş) — bu durumda engellemek yerine sadece
  // uyarı veriyoruz; stok gönderim sırasında eksiye düşecek.
  if(it && it.trackStock && delta>0 && next>it.stock){
    showToast('Uyarı: bu üründen stok yetersiz görünüyor, sipariş stoğu eksiye düşürecek');
  }
  if(next===0) delete CART[itemId]; else CART[itemId]=next;
  saveCart();
  render();
}
async function sendOrder(tableId){
  const session = getSession();
  const items = Object.entries(CART).map(([id,qty])=>{ const it=findItem(id); return {id,name:it.name,price:it.price,qty,note:(CART_NOTES[id]||'').trim()}; });
  if(!items.length) return;
  let wentNegative = false;
  items.forEach(oi=>{ const it=findItem(oi.id); if(it && it.trackStock){ it.stock = it.stock - oi.qty; if(it.stock<0) wentNegative = true; } });
  // Garsonun girdiği sipariş de, müşteri QR siparişi gibi, doğrudan mutfağa düşmez —
  // önce saha ekibi (kasiyer/yönetici/garson) onaylamalıdır (bkz. approveOrderModalHtml).
  // Böylece siparişin gerçekten hazırlanacağı teyit edilmiş olur.
  const order = { id:genId('o'), tableId, items, status:'yeni', staffId:session.staffId, source:'staff', createdAt:Date.now() };
  STATE.orders.push(order);
  if(!STATE.assign[tableId]) STATE.assign[tableId] = session.staffId;
  await Promise.all([ sSet('seyir:orders', STATE.orders), sSet('seyir:assign', STATE.assign), sSet('seyir:menu', STATE.menu) ]);
  CART = {};
  CART_NOTES = {};
  saveCart();
  saveCartNotes();
  showToast(wentNegative ? 'Sipariş gönderildi (onay bekliyor) — bazı ürünler stokta eksiye düştü' : 'Sipariş gönderildi, saha onayı bekleniyor ✓');
  render();
}

async function finalizeCloseBill(tableId, method, cariId){
  const session = getSession();
  if(!(session.role==='kasiyer'||session.role==='yonetici')) return;
  const orders = tableOrders(tableId);
  if(!orders.length) return;
  const total = tableTotal(tableId);
  const bill = { id:genId('b'), tableId, tableName:findTable(tableId).name, orders, total, method, cariId: cariId||null, closedAt: Date.now() };
  STATE.bills.push(bill);
  STATE.orders = STATE.orders.filter(o=>o.tableId!==tableId);
  delete STATE.assign[tableId];
  delete STATE.tableCustomLabels[tableId];
  STATE.readyAlerts = (STATE.readyAlerts||[]).filter(id=>id!==tableId);
  const promises = [ sSet('seyir:bills', STATE.bills), sSet('seyir:orders', STATE.orders), sSet('seyir:assign', STATE.assign), sSet('seyir:tableCustomLabels', STATE.tableCustomLabels), sSet('seyir:readyAlerts', STATE.readyAlerts) ];
  if(method==='Cari' && cariId){
    const acc = STATE.cari.find(c=>c.id===cariId);
    if(acc){
      acc.balance += total;
      acc.transactions.push({id:genId('tx'), type:'borc', amount:total, tableName:bill.tableName, date:Date.now()});
      promises.push(sSet('seyir:cari', STATE.cari));
    }
  }
  await Promise.all(promises);
  closeModal();
  showToast('Adisyon kapatıldı ✓');
  location.hash = '/masalar';
}

// ================= MUTFAK (kitchen — dinamik istasyonlara göre filtrelenir) =================
// Bir siparişin, o anki istasyona ait sadece kalemlerini döndürür (kategori o istasyona
// atanmamışsa ürün her istasyonda görünür — yapılandırılmamış menülerde hiçbir şey kaybolmaz).
function orderItemsForStation(o, stationId){
  if(!stationId) return o.items;
  return o.items.filter(it=>{ const mi=findItem(it.id); return mi ? itemBelongsToStation(mi.catId, stationId) : true; });
}
function renderMutfak(){
  const session = getSession();
  const stationId = session ? session.stationId : null;
  const relevantOrders = STATE.orders.filter(o=>orderItemsForStation(o,stationId).length>0);
  const yeni = relevantOrders.filter(o=>o.status==='yeni').sort((a,b)=>a.createdAt-b.createdAt);
  const haz = relevantOrders.filter(o=>o.status==='hazirlaniyor').sort((a,b)=>a.createdAt-b.createdAt);
  const rdy = relevantOrders.filter(o=>o.status==='hazir').sort((a,b)=>a.createdAt-b.createdAt);
  function ticket(o, cls, nextStatus, nextLabel){
    const mins = Math.max(0, Math.round((Date.now()-o.createdAt)/60000));
    const pending = o.status==='yeni';
    const items = orderItemsForStation(o, stationId);
    return `<div class="ticket ${cls}">
      <div class="head"><span class="tname">${esc(findTable(o.tableId)?.name||o.tableId)}</span><span class="time">${mins} dk</span></div>
      <div class="waiter">${orderStaffLabel(o)}${pending?' · <b style="color:var(--danger);">Onay bekliyor</b>':''}</div>
      <ul>${items.map(it=>`<li>${it.qty}× ${esc(it.name)}${it.note?` <span style="color:var(--warn);font-weight:700;">(${esc(it.note)})</span>`:''}</li>`).join('')}</ul>
      <div style="display:flex;gap:8px;">
        ${pending?`<button class="btn sm" onclick="openModal({type:'approveOrder',orderId:'${o.id}'})">✓ Onayla</button>`:(nextStatus?`<button class="btn sm" onclick="advanceOrder('${o.id}','${nextStatus}')">${nextLabel}</button>`:'')}
        ${pending?`<button class="btn ghost sm" onclick="rejectOrder('${o.id}')">Reddet</button>`:''}
      </div>
    </div>`;
  }
  const stName = currentStationName();
  const actives = activeStations();
  return `
    <div class="order-header">
      <div class="page-title" style="margin:0;">Mutfak Ekranı${stName?` — ${esc(stName)}`:''}</div>
      ${actives.length>1?`<a class="back" href="#/istasyon-sec">İstasyon Değiştir ⇄</a>`:''}
    </div>
    <div class="page-sub">Siparişler otomatik olarak güncellenir. Onay bekleyen sipariş varken ekran kırmızı yanıp söner.</div>
    <div class="kitchen-cols">
      <div class="kcol"><div class="kcol-head"><b>Yeni (Onay Bekleyen)</b><span class="count">${yeni.length}</span></div>
        ${yeni.length?yeni.map(o=>ticket(o,'urgent')).join(''):'<p class="empty-note">Bekleyen yok</p>'}
      </div>
      <div class="kcol"><div class="kcol-head"><b>Hazırlanıyor</b><span class="count">${haz.length}</span></div>
        ${haz.length?haz.map(o=>ticket(o,'warn','hazir','Hazır →')).join(''):'<p class="empty-note">Yok</p>'}
      </div>
      <div class="kcol"><div class="kcol-head"><b>Hazır</b><span class="count">${rdy.length}</span></div>
        ${rdy.length?rdy.map(o=>ticket(o,'ready','servis','Servis Edildi ✓')).join(''):'<p class="empty-note">Yok</p>'}
      </div>
    </div>
  `;
}
async function advanceOrder(orderId, nextStatus){
  const o = STATE.orders.find(x=>x.id===orderId); if(!o) return;
  o.status = nextStatus;
  const promises = [ sSet('seyir:orders', STATE.orders) ];
  // Mutfak siparişi "Hazır" olarak işaretlediğinde, saha ekibinin masa ekranında o masa
  // yeşil yanıp sönmeye başlar ve saha ekibi masaya dokunana kadar (bkz. renderOrderEntry) devam eder.
  if(nextStatus==='hazir' && !(STATE.readyAlerts||[]).includes(o.tableId)){
    STATE.readyAlerts = STATE.readyAlerts||[]; STATE.readyAlerts.push(o.tableId);
    promises.push(sSet('seyir:readyAlerts', STATE.readyAlerts));
  }
  await Promise.all(promises);
  render();
}
// Not: Sipariş onaylama artık openModal({type:'approveOrder',...}) ile açılan seçim
// ekranından yapılır (bkz. approveOrderModalHtml / confirmApproveOrder) — böylece
// personel onaylamadan önce ürünleri tek tek seçip/adedini değiştirip mutfağa
// öyle gönderebilir; onaylanmayan/reddedilen ürünler asla hazırlığa düşmez.
async function rejectOrder(orderId){
  const o = STATE.orders.find(x=>x.id===orderId); if(!o) return;
  if(!confirm('Bu siparişi reddetmek istediğinize emin misiniz? Stok iade edilecek.')) return;
  o.items.forEach(it=>{ const mi=findItem(it.id); if(mi && mi.trackStock){ mi.stock += it.qty; } });
  STATE.orders = STATE.orders.filter(x=>x.id!==orderId);
  await Promise.all([ sSet('seyir:orders', STATE.orders), sSet('seyir:menu', STATE.menu) ]);
  showToast('Sipariş reddedildi');
  render();
}

// ---------- yanlış ürün silme (kasiyer / yönetici) ----------
async function deleteOrderItem(orderId, itemIdx){
  const session = getSession();
  if(!(session.role==='kasiyer' || session.role==='yonetici')) return;
  const o = STATE.orders.find(x=>x.id===orderId); if(!o) return;
  const removed = o.items[itemIdx]; if(!removed) return;
  if(!confirm(removed.qty+'× '+removed.name+' adisyondan silinsin mi?')) return;
  const mi = findItem(removed.id);
  if(mi && mi.trackStock){ mi.stock += removed.qty; }
  o.items.splice(itemIdx,1);
  if(o.items.length===0){ STATE.orders = STATE.orders.filter(x=>x.id!==orderId); }
  await Promise.all([ sSet('seyir:orders', STATE.orders), sSet('seyir:menu', STATE.menu) ]);
  showToast('Ürün adisyondan silindi ✓');
  render();
}

function moveQtyChange(delta){
  const o = STATE.orders.find(x=>x.id===MODAL.orderId);
  if(!o) return;
  const max = o.items[MODAL.itemIdx] ? o.items[MODAL.itemIdx].qty : 1;
  MODAL.qty = Math.max(1, Math.min(max, (MODAL.qty||1)+delta));
  render();
}
async function confirmMoveItem(orderId, itemIdx, targetTableId){
  const session = getSession();
  if(!(session.role==='kasiyer' || session.role==='yonetici')) return;
  const o = STATE.orders.find(x=>x.id===orderId); if(!o) return;
  const it = o.items[itemIdx]; if(!it) return;
  const moveQty = Math.max(1, Math.min(it.qty, MODAL.qty || it.qty));
  let movedItem;
  if(moveQty>=it.qty){
    movedItem = it;
    o.items.splice(itemIdx,1);
    if(o.items.length===0){ STATE.orders = STATE.orders.filter(x=>x.id!==o.id); }
  }else{
    it.qty -= moveQty;
    movedItem = Object.assign({}, it, {qty: moveQty});
  }
  const newOrder = { id:genId('o'), tableId: targetTableId, items:[movedItem], status:o.status, staffId:session.staffId, source:o.source, createdAt:Date.now() };
  STATE.orders.push(newOrder);

  await Promise.all([ sSet('seyir:orders', STATE.orders), sSet('seyir:assign', STATE.assign) ]);

function approveOrderModalHtml(orderId){
  const o = STATE.orders.find(x=>x.id===orderId);
  if(!o) return `<p>Sipariş bulunamadı.</p>`;
  if(!MODAL.qtys) MODAL.qtys = o.items.map(it=>it.qty);
  const table = findTable(o.tableId);
  const anySelected = MODAL.qtys.some(q=>q>0);
  return `
    <span class="close-x" onclick="closeModal()">✕</span>
    <h3>Siparişi Onayla</h3>
    <p class="page-sub">${esc(table?table.name:'')} — istemediğiniz ürünü 0'a indirin veya adedini azaltın, sonra onaylayın.</p>
    <div class="adisyon-list">
      ${o.items.map((it,idx)=>`
        <div class="adisyon-row" style="flex-wrap:wrap;">
          <div><div class="nm">${esc(it.name)}</div><div class="meta">${money(it.price)}${it.note?` · Not: ${esc(it.note)}`:''}</div></div>
          <div class="qty-stepper">
            <button class="btn ghost sm" onclick="approveQtyChange(${idx},-1)">−</button>
            <b>${MODAL.qtys[idx]}</b>
            <button class="btn ghost sm" onclick="approveQtyChange(${idx},1)">+</button>
            <span style="font-size:11px;color:var(--ink-faint);">/ ${it.qty}</span>
          </div>
        </div>
      `).join('')}
    </div>
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button class="btn ghost block" onclick="closeModal()">Vazgeç</button>
      <button class="btn block" ${anySelected?'':'disabled'} onclick="confirmApproveOrder('${orderId}')">Onayla ve Mutfağa Gönder</button>
    </div>
  `;
}
function approveQtyChange(idx, delta){
  const o = STATE.orders.find(x=>x.id===MODAL.orderId);
  if(!o || !o.items[idx]) return;
  const max = o.items[idx].qty;
  MODAL.qtys[idx] = Math.max(0, Math.min(max, (MODAL.qtys[idx]||0)+delta));
  render();
}
async function confirmApproveOrder(orderId){
  const o = STATE.orders.find(x=>x.id===orderId); if(!o) return;
  const qtys = MODAL.qtys || o.items.map(it=>it.qty);
  const newItems = [];
  o.items.forEach((it,idx)=>{
    const keep = qtys[idx]!==undefined ? qtys[idx] : it.qty;
    const removed = it.qty - keep;
    if(removed>0){
      // sipariş gönderim anında stok zaten düşülmüştü (hem müşteri QR hem personel siparişinde) — çıkarılan adedi iade et
      const mi = findItem(it.id); if(mi && mi.trackStock){ mi.stock += removed; }
    }
    if(keep>0){ newItems.push(Object.assign({}, it, {qty:keep})); }
  });
  if(newItems.length===0){
    STATE.orders = STATE.orders.filter(x=>x.id!==orderId);
    await Promise.all([ sSet('seyir:orders', STATE.orders), sSet('seyir:menu', STATE.menu) ]);
    showToast('Sipariş tamamen reddedildi');
  }else{
    o.items = newItems;
    o.status = 'hazirlaniyor'; // onaylanmayan/reddedilen sipariş asla mutfağa (hazırlığa) düşmez — sadece onaylanan adetler düşer
    await Promise.all([ sSet('seyir:orders', STATE.orders), sSet('seyir:menu', STATE.menu) ]);
    showToast('Sipariş onaylandı ve mutfağa gönderildi ✓');
  }
  closeModal();
  render();
}

    </div>

async function confirmMoveTable(fromId, toId){
  const session = getSession();
  if(!(session.role==='kasiyer' || session.role==='yonetici')) return;
  const moved = STATE.orders.filter(o=>o.tableId===fromId);
  if(!moved.length){ showToast('Bu masada taşınacak sipariş yok'); closeModal(); return; }
  moved.forEach(o=>{ o.tableId = toId; });
  if(!STATE.assign[toId]) STATE.assign[toId] = STATE.assign[fromId];
  delete STATE.assign[fromId];
  await Promise.all([ sSet('seyir:orders', STATE.orders), sSet('seyir:assign', STATE.assign) ]);
  closeModal();
  showToast('Masa taşındı / birleştirildi ✓');
  render();
}

// ================= RAPOR =================
function ymd(ts){
  const d = new Date(ts);
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function billsInRange(start, end){
  // Tarihleri Date nesnesi yerine düz "YYYY-MM-DD" metin olarak karşılaştırıyoruz;
  // böylece saat dilimi / gün sonu ayrıştırma kaynaklı hatalı ciro filtreleme sorunu oluşmaz.
  return STATE.bills.filter(b=>{
    const day = ymd(b.closedAt);
    if(start && day < start) return false;
    if(end && day > end) return false;
    return true;
  });
}
function setRaporRange(start,end){ RAPOR_START = start||null; RAPOR_END = end||null; render(); }
function raporToday(){ const d=new Date().toISOString().slice(0,10); setRaporRange(d,d); }
function raporThisMonth(){ const n=new Date(); const s=new Date(n.getFullYear(),n.getMonth(),1).toISOString().slice(0,10); setRaporRange(s, n.toISOString().slice(0,10)); }
function raporAllTime(){ setRaporRange(null,null); }
function setRaporBestCat(cid){ RAPOR_BESTCAT = cid; render(); }
const PAYMENT_LABEL = {Nakit:'Nakit', Kart:'Kredi Kartı', Cari:'Açık Hesap (Cari)'};
const RAPOR_MONTH_NAMES = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
function monthRevenue(year, month){
  const start = `${year}-${String(month+1).padStart(2,'0')}-01`;
  const lastDay = new Date(year, month+1, 0).getDate();
  const end = `${year}-${String(month+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  return billsInRange(start,end).reduce((s,b)=>s+b.total,0);
}
function changeRaporYear(delta){ RAPOR_YEAR = (RAPOR_YEAR||new Date().getFullYear()) + delta; render(); }
function selectRaporMonth(year, month){
  const start = `${year}-${String(month+1).padStart(2,'0')}-01`;
  const lastDay = new Date(year, month+1, 0).getDate();
  const end = `${year}-${String(month+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  RAPOR_START = start; RAPOR_END = end;
  closeModal();
}

async function addExpense(){

async function deleteExpense(id){

async function addCariAccount(){
  const n = document.getElementById('newcariname'), p = document.getElementById('newcariphone');
  const name = n.value.trim();
  if(!name){ alert('Cari hesap için isim girilmesi zorunludur.'); return; }
  STATE.cari.push({ id:genId('cr'), name, phone:p.value.trim(), balance:0, transactions:[] });
  await sSet('seyir:cari', STATE.cari);
  render();
}
async function deleteCariAccount(id){
  const c = STATE.cari.find(x=>x.id===id);
  if(c && c.balance>0){ alert('Bakiyesi olan bir cari hesap silinemez. Önce ödeme alın.'); return; }
  STATE.cari = STATE.cari.filter(x=>x.id!==id);
  await sSet('seyir:cari', STATE.cari);
  render();
}
function cariDetailModalHtml(cariId){
  const c = STATE.cari.find(x=>x.id===cariId);
  if(!c) return `<p>Hesap bulunamadı.</p>`;
  return `
    <span class="close-x" onclick="closeModal()">✕</span>
    <h3>${esc(c.name)}</h3>
    <p class="page-sub">Güncel Bakiye: <b>${money(c.balance)}</b></p>
    <div class="table-list" style="margin-top:10px;">
      ${c.transactions.length? c.transactions.slice().reverse().map(t=>`
        <div class="r"><span>${new Date(t.date).toLocaleString('tr-TR')}${t.tableName?` · ${esc(t.tableName)}`:''}</span>
        <b style="color:${t.type==='borc'?'var(--danger)':'var(--brand-deep)'};">${t.type==='borc'?'+':'-'}${money(Math.abs(t.amount))}</b></div>
      `).join('') : '<div class="r"><span>Hareket yok</span></div>'}
    </div>
  `;
}
function cariPayModalHtml(cariId){
  const c = STATE.cari.find(x=>x.id===cariId);
  if(!c) return `<p>Hesap bulunamadı.</p>`;
  return `
    <span class="close-x" onclick="closeModal()">✕</span>
    <h3>${esc(c.name)} — Ödeme Al</h3>
    <p class="page-sub">Güncel Bakiye: <b>${money(c.balance)}</b></p>
    <div class="form-inline">
      <input id="caripayamt" type="number" value="${c.balance}">
      <button class="btn sm" onclick="collectCariPayment('${c.id}')">Ödemeyi Kaydet</button>
    </div>
  `;
}
async function collectCariPayment(cariId){
  const c = STATE.cari.find(x=>x.id===cariId); if(!c) return;
  const el = document.getElementById('caripayamt');
  let amt = parseFloat(el.value)||0;
  if(amt<=0){ alert('Geçerli bir tutar girin.'); return; }
  if(amt>c.balance) amt = c.balance;
  c.balance -= amt;
  c.transactions.push({id:genId('tx'), type:'odeme', amount:amt, date:Date.now()});
  await sSet('seyir:cari', STATE.cari);
  closeModal();
  showToast('Ödeme kaydedildi ✓');
}

  STATE.settings.instagramUsername = document.getElementById('set_ig').value.trim().replace(/^@/,'');
  STATE.settings.tiktokUsername = document.getElementById('set_tt').value.trim().replace(/^@/,'');
  await sSet('seyir:settings',STATE.settings); showToast('Sosyal medya bilgileri kaydedildi ✓'); render();
}
async function saveMapsSettings(){
  STATE.settings.mapsUrl = document.getElementById('set_maps').value.trim();
  await sSet('seyir:settings',STATE.settings); showToast('Harita linki kaydedildi ✓'); render();
}

// ================= PUBLIC MENU (view-only, no login) =================
function renderPublicMenu(){
  return `<div class="appbar"><div class="brand">${brandMarkHtml()}</div></div>
  <div class="content"><div class="public-menu">
    <div class="page-title">Menü</div>
    <div class="page-sub">Siparişinizi masanıza gelen personelimize iletebilir ya da masanızdaki QR kodu okutarak doğrudan sipariş verebilirsiniz.</div>
    ${iconRowHtml()}
    ${STATE.menu.map(cat=>`
      <div class="public-cat">
        <h3>${esc(cat.cat)}</h3>
        ${cat.items.filter(i=>i.available).map(it=>`
          <div class="public-item">
            ${it.photo?`<img src="${it.photo}" class="item-thumb">`:''}
            <div style="flex:1;"><div class="nm">${esc(it.name)}</div>${it.desc?`<div class="ds">${esc(it.desc)}</div>`:''}</div>
            <div class="pr">${money(it.price)}</div>
          </div>
        `).join('')}
      </div>
    `).join('')}
  </div></div>`;
}

// ================= MÜŞTERİ SİPARİŞ (QR ordering, no login) =================
function custCartKey(tableId){ return 'seyir_musteri_cart_'+tableId; }
function custCartNoteKey(tableId){ return 'seyir_musteri_cartnotes_'+tableId; }
function ensureCustCartLoaded(tableId){
  if(CUST_CART_TABLE===tableId) return;
  CUST_CART_TABLE = tableId;
  try{ CUST_CART = JSON.parse(sessionStorage.getItem(custCartKey(tableId))||'{}'); }catch(e){ CUST_CART = {}; }
  try{ CUST_CART_NOTES = JSON.parse(sessionStorage.getItem(custCartNoteKey(tableId))||'{}'); }catch(e){ CUST_CART_NOTES = {}; }
  CUST_SUBMITTED = false;
}
function saveCustCart(){ if(!CUST_CART_TABLE) return; try{ sessionStorage.setItem(custCartKey(CUST_CART_TABLE), JSON.stringify(CUST_CART)); }catch(e){} }
function saveCustCartNotes(){ if(!CUST_CART_TABLE) return; try{ sessionStorage.setItem(custCartNoteKey(CUST_CART_TABLE), JSON.stringify(CUST_CART_NOTES)); }catch(e){} }
function setCustCartNote(itemId, val){ CUST_CART_NOTES[itemId] = val; saveCustCartNotes(); } // render() ÇAĞIRMA — yazarken klavye kapanmasın

// ---------- akıllı QR: masalarda tek/ortak QR kullanılıyorsa (URL'de masa parametresi
// yoksa) müşteriden masa numarasını seçmesi istenir; masaya özel QR ise URL üzerinden
// otomatik algılanır ve bu ekran hiç gösterilmez ----------
function renderMusteriMasaSecim(){
  return `
  <div class="appbar"><div class="brand">${brandMarkHtml()}</div></div>
  <div class="content public-menu">
    <div class="page-title">Masanızı Seçin</div>
    <div class="page-sub">Devam etmek için oturduğunuz masayı seçin.</div>
    <div class="tables-grid">
      ${STATE.tables.map(t=>`<div class="table-card" style="cursor:pointer;" onclick="goToCustomerTable('${t.id}')">
        <h4>${esc(t.name)}</h4><div class="status-txt">${esc(t.zone||'')}</div>
      </div>`).join('')}
    </div>
  </div>`;
}
function goToCustomerTable(tableId){ location.hash = '/musteri?masa='+tableId; }

function renderMusteriSiparis(params){
  const tableId = params.get('masa');
  if(!tableId) return renderMusteriMasaSecim();
  const table = findTable(tableId);
  if(!table) return `<div class="content"><div class="appbar"><div class="brand">${brandMarkHtml()}</div></div><p class="empty-note">Masa bulunamadı. Lütfen QR kodu tekrar okutun.</p></div>`;
  ensureCustCartLoaded(tableId);

  if(CUST_CAT===null || !STATE.menu.find(c=>c.id===CUST_CAT)) CUST_CAT = STATE.menu[0] ? STATE.menu[0].id : null;
  const activeCat = STATE.menu.find(c=>c.id===CUST_CAT) || STATE.menu[0];
  const cartCount = Object.values(CUST_CART).reduce((a,b)=>a+b,0);
  const cartTotal = Object.entries(CUST_CART).reduce((s,[id,qty])=>{ const it=findItem(id); return s+(it?it.price*qty:0); },0);
  const myOrders = tableOrders(tableId).filter(o=>o.source==='musteri');

  return `
  <div class="appbar"><div class="brand">${brandMarkHtml()}</div></div>
  <div class="content public-menu">
    <div class="page-title">${esc(table.name)}</div>
    <div class="page-sub">Menüden seçim yapıp doğrudan sipariş gönderebilirsiniz.</div>
    ${iconRowHtml()}
    ${CUST_SUBMITTED ? `
      <div class="empty-note">⏳ Siparişiniz alındı, personelimizin onayını bekliyor.<br>Onaylandığında hazırlanmaya başlanacaktır.<br>
        <button class="btn sm" style="margin-top:12px;" onclick="CUST_SUBMITTED=false; render();">Yeni Sipariş Ekle</button>
      </div>
    ` : `
      <div class="cat-tabs">
        ${STATE.menu.map(c=>`<button class="${activeCat && c.id===activeCat.id?'active':''}" onclick="setCustCat('${c.id}')">${esc(c.cat)}</button>`).join('')}
      </div>
      <div class="item-grid">
        ${activeCat ? activeCat.items.map(it=>{
          const soldOut = !it.available || (it.trackStock && it.stock<=0);
          const qty = CUST_CART[it.id]||0;
          return `<button class="item-tile ${soldOut?'sold-out':''}" ${soldOut?'disabled':`onclick="custCartAdd('${it.id}')"`}>
            ${qty>0?`<div class="badge-qty">${qty}</div>`:''}
            ${it.photo?`<div class="tile-photo" style="background-image:url('${it.photo}')"></div>`:''}
            <div class="nm">${esc(it.name)}</div>
            <div class="pr">${money(it.price)}</div>
          </button>`;
        }).join('') : ''}
      </div>
      ${cartCount>0 ? `
        <div class="section-label">Sepetiniz</div>
        <div class="adisyon-list">
          ${Object.entries(CUST_CART).map(([id,qty])=>{
            const it = findItem(id);
            return `<div class="adisyon-row" style="flex-wrap:wrap;">
              <div><div class="nm">${esc(it.name)}</div><div class="meta">${money(it.price)}</div></div>
              <div style="display:flex;align-items:center;gap:10px;">
                <button class="btn ghost sm" onclick="custCartAdd('${id}',-1)">−</button><b>${qty}</b>
                <button class="btn ghost sm" onclick="custCartAdd('${id}',1)">+</button>
              </div>
              <input id="custnote_${id}" style="width:100%;padding:7px 9px;border-radius:7px;border:1px solid var(--line);font-size:12.5px;" placeholder="Not ekle (örn. şekersiz, az pişmiş...)" value="${esc(CUST_CART_NOTES[id]||'')}" oninput="setCustCartNote('${id}', this.value)">
            </div>`;
          }).join('')}
        </div>
      ` : `<p class="empty-note">Sepetiniz boş, ürünlere dokunarak ekleyin.</p>`}
    `}
    ${myOrders.length ? `
      <div class="section-label">Siparişleriniz</div>
      <div class="adisyon-list">
        ${myOrders.map(o=>o.items.map(it=>`<div class="adisyon-row">
            <div><div class="nm">${it.qty}× ${esc(it.name)}</div>${it.note?`<div class="meta">Not: ${esc(it.note)}</div>`:''}</div>
            <span class="status-pill ${o.status==='yeni'?'status-yeni':'status-'+o.status}">${o.status==='yeni'?'Onay Bekliyor':statusLabel(o.status)}</span>
          </div>`).join('')).join('')}
      </div>
    ` : ''}
  </div>
  ${(!CUST_SUBMITTED && cartCount>0) ? `<div class="cart-dock">
    <div><div class="total">${money(cartTotal)}</div><div class="sub">${cartCount} ürün</div></div>
    <button class="btn" style="background:#fff;color:var(--navy);" onclick="submitCustomerOrder('${tableId}')">Siparişi Gönder</button>
  </div>` : ''}
  `;
}
function setCustCat(id){ CUST_CAT=id; render(); }
function custCartAdd(itemId, delta){
  delta = delta===undefined ? 1 : delta;
  const it = findItem(itemId);
  const cur = CUST_CART[itemId]||0;
  let next = Math.max(0, cur+delta);
  if(it && it.trackStock && delta>0 && next>it.stock){
    showToast(it.stock>0 ? ('Stokta sadece '+it.stock+' adet var') : 'Bu ürün tükendi');
    next = cur;
  }
  if(next===0) delete CUST_CART[itemId]; else CUST_CART[itemId]=next;
  saveCustCart();
  render();
}
async function submitCustomerOrder(tableId){
  const items = Object.entries(CUST_CART).map(([id,qty])=>{ const it=findItem(id); return {id,name:it.name,price:it.price,qty,note:(CUST_CART_NOTES[id]||'').trim()}; });
  if(!items.length) return;
  // Müşteri siparişi doğrudan kaydedilip mutfağa düşmez — 'yeni' (onay bekliyor)
  // durumunda oluşturulur; masada kırmızı ışık yanıp söner ve personel onaylayana
  // kadar hazırlığa geçmez (bkz. tableStatus / approveOrder).
  items.forEach(oi=>{ const it=findItem(oi.id); if(it && it.trackStock){ it.stock = Math.max(0, it.stock-oi.qty); } });
  const order = { id:genId('o'), tableId, items, status:'yeni', staffId:null, source:'musteri', createdAt:Date.now() };
  STATE.orders.push(order);
  await Promise.all([ sSet('seyir:orders', STATE.orders), sSet('seyir:menu', STATE.menu) ]);
  CUST_CART = {};
  CUST_CART_NOTES = {};
  saveCustCart();
  saveCustCartNotes();
  CUST_SUBMITTED = true;
  render();
}
</script>
</body>
</html>
